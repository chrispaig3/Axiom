[workspace]
members = [
    "axiom-ast",
    "axiom-lexer",
    "axiom-parser",
    "axiom-sema",
    "axiom-ir",
    "axiom-codegen",
    "axiom-cli",
    "axiom-errors",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Axiom Contributors"]
license = "MIT"

[workspace.dependencies]
axiom-ast = { path = "axiom-ast" }
axiom-lexer = { path = "axiom-lexer" }
axiom-parser = { path = "axiom-parser" }
axiom-sema = { path = "axiom-sema" }
axiom-ir = { path = "axiom-ir" }
axiom-codegen = { path = "axiom-codegen" }
axiom-errors = { path = "axiom-errors" }
thiserror = "1.0"
ariadne = "0.4"
rustyline = "14"
colored = "2"
dirs = "5"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"

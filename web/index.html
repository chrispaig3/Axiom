<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Axiom — a functional systems language for humans and agents</title>
    <meta
      name="description"
      content="Axiom is a functional systems programming language: S-expression syntax, a Hindley-Milner-inspired type system, and an LLVM backend that emits native executables with no VM and no runtime. The compiler is written in Axiom."
    />
    <meta name="theme-color" content="#0a0c0f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fbfbfc" media="(prefers-color-scheme: light)" />
    <link rel="canonical" href="https://chrispaig3.github.io/Axiom/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Axiom" />
    <meta property="og:title" content="Axiom — a functional systems language for humans and agents" />
    <meta
      property="og:description"
      content="S-expressions, a Hindley-Milner-inspired type system, and an LLVM backend that emits native executables with no VM and no runtime. The compiler is written in Axiom."
    />
    <meta property="og:url" content="https://chrispaig3.github.io/Axiom/" />
    <meta property="og:image" content="https://chrispaig3.github.io/Axiom/axiom-logo.jpg" />
    <meta property="og:image:alt" content="The Axiom logo" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/png" href="/axiom-mark.png" />
    <link rel="apple-touch-icon" href="/axiom-mark.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />

    <script>
      // Applied before first paint so the page never flashes the wrong
      // theme. Mirrors the logic in src/lib/theme.ts; kept inline
      // deliberately, because a module import is too late to help.
      (function () {
        try {
          var saved = localStorage.getItem('axiom-theme')
          if (saved === 'dark' || saved === 'light') {
            document.documentElement.setAttribute('data-theme', saved)
          }
        } catch (e) {
          /* private mode, blocked storage: keep the system preference */
        }
      })()
    </script>
    <noscript>
      <style>
        /* The entrance transition belongs to JavaScript. Now that the
           markup ships in the HTML, a reader without JS — and any
           renderer that bails before the observer fires — would get a
           page that is present and invisible. Put it where the
           transition would have ended. */
        .reveal { opacity: 1 !important; transform: none !important; }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

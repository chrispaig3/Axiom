    <script>
      // Applied before first paint so the page never flashes the wrong
      // theme. Mirrors the logic in src/lib/theme.ts; kept inline
      // deliberately, because a module import is too late to help.
      (function () {
        try {
          var saved = localStorage.getItem('axiom-theme')
          if (saved === 'dark' || saved === 'light') {
            document.documentElement.setAttribute('data-theme', saved)
          }
        } catch (e) {
          /* private mode, blocked storage: the default theme stands */
        }
      })()
    </script>

name: CI

# Staged so that a cheap failure is reported before an expensive one:
# formatting and lints gate the test job, and the test job gates the
# cross-platform matrix. Every job needs `llc` and a linker, because the
# interesting tests compile and *run* Axiom programs rather than only
# type-checking them - a syscall lowering that assembles but returns the
# wrong value is exactly the class of bug a type-check-only CI misses.

on:
  push:
    # `trunk` is this repository's only branch. This said `main` from
    # the day the workflow was added, so no push had ever triggered a
    # run - the gates were green only on pull requests and local
    # batteries, and a week of self-hosting work landed with CI
    # structurally silent. A trigger that names a branch that does
    # not exist is indistinguishable in the checks tab from a quiet
    # success.
    branches: [trunk]
  pull_request:

# No `env:` block. It used to set `CARGO_TERM_COLOR` and `RUSTFLAGS: -D
# warnings`, both of which outlived the Rust compiler they configured.
# Cargo is back - the FFI workspace under `rust/` is a cargo workspace,
# and the `ffi` job below builds and tests it - but a repository-wide
# `-D warnings` is not the promise those crates want, and the
# reproducibility property the old block claimed is gated for real by
# `scripts/check-reproducible.sh`.

jobs:
  # The cheap gate that fails first. It used to be `cargo fmt` and
  # `cargo clippy` over the Rust compiler; with that compiler deleted,
  # the equivalent cheap check is the one thing here that needs no
  # compiler at all - the tree-sitter grammar must still parse every
  # `.ax` file in the repository. A grammar that has drifted from the
  # parser is the failure this catches before anything expensive runs.
  grammar:
    name: Tree-sitter grammar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The grammar has to accept every `.ax` file in the repository.
      # Nothing here compiles anything: the check parses checked-in
      # sources, so only the tree-sitter CLI is needed.
      - run: npm install --prefix tree-sitter-axiom --no-save tree-sitter-cli
      - name: Every .ax file parses under the checked-in grammar
        run: ./scripts/check-tree-sitter.sh


  test:
    name: Tests (${{ matrix.name }})
    needs: grammar
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: linux-aarch64
            os: ubuntu-24.04-arm
          - name: darwin-aarch64
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # `llc` is not on the default PATH on either runner image, and the
      # compiler shells out to it by name. `llvm-readobj` comes from the
      # same package and is what the cross-target gate uses to reject
      # non-position-independent objects.
      - uses: ./.github/actions/provision

      # These cases were also run by the deleted Rust test suite, as
      # `stdlib_golden`. This script is now their only runner, which is
      # the reason it was kept alive alongside that suite for so long.
      - name: Standard-library golden tests
        run: ./scripts/run-stdlib-tests.sh

      - name: Freestanding check
        run: ./scripts/check-freestanding.sh

      # It runs in the matrix rather than on a single host because it
      # compiles, assembles and *runs* the output of the self-hosted
      # compiler, and both the syscall numbers and the object format are
      # platform-specific.
      #
      # This replaces a `Game of Life` step that invoked
      # `scripts/check-game-of-life.sh`. That script was removed in
      # 720a0d5 along with the sample it ran, but the step referencing it
      # was not, so every run of this job failed on a missing file - which
      # is why "CI green on all four targets" needs re-establishing rather
      # than citing.
      - name: Self-hosted compiler conformance
        run: ./scripts/check-self-host.sh

      # The compiler's command-line surface, which until this gate
      # existed was exercised by nothing: every other gate drives stage1
      # as `stage1 [FILE [TARGET]]` and runs llc and cc itself, so
      # `stage1 build` - the thing a user types - had no coverage at all.
      #
      # Its load-bearing cases are the negative ones. A driver that
      # ignores a child's exit status reports a failed `llc` as a
      # successful build while every positive test still passes, so the
      # script poisons PATH in two directions: a failing tool must fail
      # the build, and a missing `opt` must not.
      - name: Self-hosted compiler driver
        run: ./scripts/check-driver.sh

      # The differential gate, and it was not here. It exists because
      # nothing ran `tests/stdlib/` through stage1 and five miscompiles
      # were hiding in the gap - and then it ran only when somebody
      # typed its name, which is the same gap one level up. This file's
      # own risk table calls that out: a tool with no CI gate is
      # silently broken, as `fmt` was.
      #
      # It compiles every case in BOTH corpora with both compilers,
      # puts each one's IR through the identical llc/cc pipeline at
      # -O0 and -O2, and compares exit status and stdout. Holding the
      # toolchain constant is what makes it a comparison of the two
      # compilers rather than of two build pipelines.
      - name: Differential behaviour between the compilers
        run: ./scripts/check-stdlib-selfhost.sh

      # The AXDL corpus against checked-in goldens, plus the half a
      # re-bless cannot satisfy: verify-axdl-spans.py recomputes every
      # span claim from the FIXTURE'S own bytes, so a wrong column
      # blessed into a golden still fails. This was a three-way
      # differential against the Rust compiler until that compiler was
      # deleted; a differential does not fail when its reference
      # disappears, so the arm was removed rather than repointed. It
      # also fails on any diagnostic at all against the compiler's own
      # source, where a false positive would stop it compiling itself.
      - name: The AXDL corpus, and every span against the fixtures
        run: ./scripts/check-diagnostics.sh

      # Degenerate input answers with a diagnostic, not with a signal.
      # `axiom check` on `(fn (main) ())` was SIGSEGV - exit 139, no
      # output, nothing on stderr - and so were twenty-two other
      # positions of the same two characters, seven of them inside
      # `check`, which is what `axiom lsp` runs for every keystroke.
      #
      # No gate above could see it, and the reason is the point of this
      # one: every other suite asks what the compiler PRINTED, and a
      # process killed by a signal prints nothing, so it satisfies any
      # check written as "the output must not contain X". This one asks
      # about the process.
      - name: Degenerate input is diagnosed, not fatal
        run: ./scripts/check-degenerate.sh

      # A name the frontend accepts is a name the backend can emit.
      # `foo'`, `a+b` and `set!` are legal Axiom names - the lexer, the
      # parser, the checker, `fmt` and `symbols` all took them - and
      # codegen wrote them into LLVM unquoted, where they are not legal
      # at all, so twelve of the sixteen bytes `isIdentChar` admits
      # exited 4 with `opt` blamed for the compiler's own output.
      #
      # It is the same blind spot as the two above: all 1,629 top-level
      # names in `stdlib/` and `self_host/` are inside LLVM's set, so no
      # sweep over real code can find it. This one sweeps the RULE - all
      # 94 printable bytes, in three positions - and every probe must
      # either be refused with a span or run to 42.
      - name: Every legal name is an emittable name
        run: ./scripts/check-symbol-names.sh

      # How much STACK the compiler needs, bisected and reported. This
      # backend eliminates only SELF tail calls and a `let` body is not a
      # tail position, so `(let ((e (vecGet v i))) (if ... e (recur ...)))`
      # - the shape most of `typecheck.ax` is written in - costs one real
      # frame per table entry. That has produced three SIGSEGVs here, each
      # presenting as a crash in whatever was being compiled rather than in
      # the walk. Nothing measured it until now; the answer is ~216 KiB
      # against an 8 MiB default, so the conversions are not urgent, and
      # this is how we find out when that stops being true.
      - name: Checking the compiler fits in a small stack
        run: ./scripts/check-stack-depth.sh

      # A module's PRIVATE declarations must cost no more to resolve
      # than its public ones. `findFnEnt` was indexed and its note
      # recorded what was left linear on purpose - the private-name
      # path - which is exactly the shape that rots unwatched. The gate
      # was written, and then run by nobody for eight days.
      - name: Private names resolve as cheaply as public ones
        run: ./scripts/check-name-scale.sh

      # Two `axiom run`s in one directory must not corrupt each other.
      # The scratch name was a fixed literal in the working directory,
      # so concurrent runs overwrote each other's intermediates - and
      # the failure was not a crash but a WRONG ANSWER: one program
      # returning another's result, exit 0, nothing on stderr.
      #
      # No other gate could see it, because every other gate runs one
      # compiler at a time or gives each case its own directory. This is
      # also the prerequisite for any parallel work: no job pool can be
      # trusted while a filename is shared.
      - name: Concurrent runs in one directory do not collide
        run: ./scripts/check-concurrent-run.sh

      # `fmt` is the tool that had no gate, and it had six independent
      # ways of silently destroying a source file. This formats a copy of
      # the whole repository and re-runs the suites against it, so a
      # formatter change that alters what a program means fails here.
      - name: Formatter round-trip
        run: ./scripts/check-fmt.sh

      # The formatter, pinned without a second compiler. This was a
      # differential against the Rust `fmt` until that compiler was
      # deleted - and a differential does not FAIL when its reference
      # disappears, it passes by comparing a compiler with itself. So
      # the reference is now a checked-in corpus golden keyed by source
      # hash, plus the idempotence and preservation properties and the
      # `tests/fmt/parity/*.axp` refusal bank.
      - name: Formatter goldens, idempotence and refusals
        run: ./scripts/check-fmt-selfhost.sh

      # `explain` and `symbols`, pinned without a second compiler: every
      # code the corpus emits must be one `explain --list` lists, and
      # every `.ax` file's AXSYM output is compared against a checked-in
      # golden with its exit status, accepted and refused files counted
      # live rather than against a hard-coded number.
      - name: explain and symbols against their goldens
        run: ./scripts/check-tools-selfhost.sh

      # The standard library performs exactly the effects it declares,
      # and the set of declarations performing any is the one on file.
      # `docs/agent-harness.md` §3.4's Agent.Policy, and a GATE rather
      # than a compiler mode for the reason that document gives: the
      # only boundary policy that has ever worked here is `check-ffi.sh`
      # comparing a binary's symbols against a checked-in manifest with
      # a negative probe, and this is that shape over the AXSYM stream.
      # It found two stdlib functions performing I/O without claiming it
      # on its first run.
      - name: The standard library declares what it performs
        run: ./scripts/check-agent-policy.sh

      # The native human and JSON diagnostic renderers, pinned without a
      # second compiler: checked-in goldens, cross-checked against the
      # AXDL goldens, exit statuses DERIVED from the golden's own
      # severity column, every quoted source row checked against the
      # fixture, and the escape stream checked against the palette
      # `self_host/style.ax` declares. Never a byte comparison with the
      # Rust compiler's human output: that output was the `ariadne`
      # crate's, an internal of a compiler that has been deleted.
      - name: Human and JSON diagnostic renderers
        run: ./scripts/check-render-selfhost.sh

      # The REPL, pinned without a second compiler: piped session by
      # piped session against checked-in goldens, byte-exact for every
      # deterministic surface and marker-pinned in shape for the ones
      # that carry a time or an address (:time/:llvm/:defs), with
      # stderr required empty and the exit code pinned.
      - name: REPL sessions against their goldens
        run: ./scripts/check-repl-selfhost.sh

      # The language server. The first tool surface that is NOT a port
      # of a stage0 tool - there is no `axiom lsp` in the Rust compiler
      # - so it cannot be a two-sided differential and is the
      # native-surface shape instead: a checked-in golden for the
      # framed session bytes, PLUS every published diagnostic checked
      # against what stage0's own AXDL reports for the same file,
      # including the column, converted from stage0's 1-based character
      # index into LSP's 0-based UTF-16 code unit. The conversion is
      # what the negative test ablates, and a version of this gate that
      # compared only line numbers passed with it removed.
      - name: Language server
        run: ./scripts/check-lsp-selfhost.sh

      # The normative documents drift because they are maintained by
      # hand: nine claims in README.md and docs/reference.md were
      # measurably false on 2026-08-10, including a benchmark ratio this
      # repository had already corrected in another file and "No LSP
      # yet" forty lines below the row listing the LSP. Correcting them
      # by hand is a treadmill - seven stale file counts have been fixed
      # one at a time across this project's history - so every count is
      # recomputed, every **Complete** row must name a fixture that
      # exists, and the diagnostic registry is compared BOTH ways
      # (a code constructed but never reached by a corpus fixture
      # escapes the emitted->listed check that already existed).
      - name: Documentation agrees with the tree
        run: ./scripts/check-doc-drift.sh

      # The frontend has five consumers - check, symbols, fmt, the
      # REPL's :load and the language server - each reaching
      # parseModuleWith/resolveImports/checkModule through its own call
      # site, and until this gate nothing compared them. Three of the
      # four defects it is seeded with exist because a NEW consumer
      # re-derived a rule the frontend already had. It asserts the
      # VALUE as well as the verdict, which is the assertion none of
      # the other gates can make: every one of those defects passed
      # `check` at exit 0 and differed only in what the program then
      # computed.
      - name: Frontend parity across its five consumers
        run: ./scripts/check-frontend-parity.sh

      # The P2 memory-model exit criterion: one Life board advanced
      # 2000 generations stays under 4 MiB when the loop carries the
      # explicit mark/copy/reset contract, grows linearly when it
      # does not, and CORRUPTS when the reset drops its copy - all
      # three measured, the third proving the gate can see the
      # unsoundness class. Automation of the contract is a future
      # slice, gated on static pointerhood (Int is the universal
      # handle type; String unifies with Int by fiat).
      - name: Memory baseline (managed flat, unmanaged linear)
        run: ./scripts/check-memory-baseline.sh

  # `rust/` is a cargo workspace with five crates, a trybuild suite and
  # a bindgen snapshot suite, and `scripts/check-ffi.sh` is the gate
  # `docs/memory-model.md` MM-FFI-5 requires - the one that enumerates
  # the external symbols the FFI opens rather than forbidding all of
  # them. None of it ran here: `tests/ffi/` (40 fixtures) was read by
  # exactly one script, and that script was read by nothing. Which is
  # the same gap this file's own risk note names - a tool with no CI
  # gate is silently broken, as `fmt` was.
  ffi:
    name: FFI (${{ matrix.name }})
    needs: grammar
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: darwin-aarch64
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/provision

      # The three tiers the gate prices, the generated binding diffed
      # against the checked-in one, the allowlist with its negative
      # probes, and a Rust binary calling into an Axiom archive.
      - name: The FFI opens exactly the door it declares
        run: ./scripts/check-ffi.sh

      # The crates' own suites: the classifier's unit tests, the
      # 21-case trybuild bank of rejected `#[axiom_export]` shapes, and
      # the bindgen snapshots. `axiom-host` is excluded because it
      # links an Axiom archive that check-ffi.sh builds, not cargo.
      - name: The FFI crates' own tests
        run: cd rust && cargo test --workspace --exclude axiom-host

  cross:
    name: Cross-target codegen
    needs: grammar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/provision

      # Every target's IR must at least assemble from a single host: the
      # standard library picks syscall numbers by target, and a typo in a
      # platform module is otherwise invisible until someone builds on
      # that platform.

      - name: Assemble every target from one host
        run: ./scripts/check-cross-targets.sh

  bootstrap:
    name: Self-hosting fixpoint
    needs: grammar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/provision

      # `stage2 == stage3` is the criterion the whole self-hosting effort
      # is aimed at, and the script that checks it was in the tree but
      # wired into nothing - so a regression in it would have been found
      # by whoever next ran it by hand.

      - name: stage2 and stage3 are byte-identical
        run: ./scripts/check-bootstrap.sh

  reproducible:
    name: Reproducible build
    needs: grammar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/provision

      - name: Byte-identical output from two independent runs
        run: ./scripts/check-reproducible.sh

  # ---------------------------------------------------------------
  # The load-bearing job. Every other one here PROVISIONS a compiler
  # from `bootstrap/` and gets on with testing something; this one
  # tests the provisioning itself, end to end, as the thing under test:
  # seed -> stage1 -> stage2 -> stage3, byte-identical at the top, and
  # a program compiled and run by the result.
  #
  # If it is green, a clean checkout of this repository produces a
  # working Axiom compiler with nothing but `llc` and a C linker. That
  # was the precondition for deleting the Rust crates, and it is now
  # the precondition for the repository being buildable at all.
  #
  # It is also what fails when the committed seed goes stale - when
  # self_host/ starts using something the seed cannot compile - and
  # `scripts/reseed.sh` is the fix. Run on both architectures because
  # the seed is per-target and a wrong syscall table in one of them is
  # invisible from the other.
  # ---------------------------------------------------------------
  bootstrap-no-rust:
    name: Bootstrap from seed (${{ matrix.name }})
    needs: grammar
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: darwin-aarch64
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Not `./.github/actions/provision`: that action ends by INSTALLING
      # the result, and what this job tests is the build itself, on the
      # two architectures where nothing else builds a seed from scratch.
      - name: Install LLVM tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang
          echo "$(llvm-config --bindir)" >> "$GITHUB_PATH"
      - name: Install LLVM tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
      - name: Build the compiler from the committed seed
        run: ./scripts/bootstrap-from-seed.sh

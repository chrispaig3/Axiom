name: CI

# Planned, selected and reused - in that order. `scope` reads the
# change set and `scripts/ci-plan.py` assigns every gate to the battery
# or a dedicated job, selects the gates whose `ci-gate.py` inputs the
# change touches, and shards them longest-first. The compiler is built
# once per platform and handed to the shards as an artifact. Inside a
# shard, `scripts/ci-run.py` runs gates in parallel (the serial set
# from `run-gates.sh` excepted), each through `ci-gate.py`, which
# reuses a recorded pass when the gate's inputs are unchanged. So a
# push runs the gates its change can affect, a rerun runs the gates
# that have not passed, and the nightly schedule runs everything.
#
# Staged so a cheap failure reports before an expensive one: the
# grammar job needs no compiler, and every job that tests needs `llc`
# and a linker, because the tests compile and run Axiom programs. A
# syscall lowering that assembles but returns the wrong value is the
# bug a type-check-only CI misses.

# A superseded run on a development ref is cancelled: its verdict
# describes a tree nobody is about to merge. Runs on `stable` always
# finish, because a release may be waiting on exactly that verdict.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/stable' }}

on:
  push:
    # Develop on nightly; stable receives changes after validation.
    branches: [stable, nightly]
    # `web/` has its own build, claim checker and deploy workflow
    # (`pages.yml`), and nothing in this battery measures it.
    #
    # Written as `paths-ignore` because a `paths:` allowlist goes silent
    # over any directory it doesn't name. With `paths-ignore`, a new
    # directory runs the battery until someone decides it shouldn't.
    paths-ignore:
      - 'web/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths-ignore:
      - 'web/**'
      - '.github/workflows/pages.yml'
  # The nightly and the button run the full battery with no change-set
  # selection, plus two jobs nothing else triggers: `seed-lineage-full`
  # replays every row of `bootstrap/CHAIN` from the Rust anchor (slow,
  # needs cargo), and `long-evidence` runs the fuzzer's full budget and
  # every trace of the executable model. The full run is the safety net
  # under change selection: a gate wrongly left out of a selective run
  # is caught here within a day.
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

# No `env:` block. A repository-wide `RUSTFLAGS: -D warnings` isn't the
# promise the FFI crates under `pkg/axiom-oxide/` want, and reproducibility is gated
# by `scripts/check-reproducible.sh`.

# Every job gets `contents: read`. Without this block a job holds the
# repository default, which can be read/write. No job pushes, comments,
# releases or reads a secret; artifacts carry only this run's own
# hand-offs (the change set, the built compilers, gate logs). Gate
# results use the branch-scoped Actions cache; the one GitHub API
# token use is `scope`'s read-only `gh api` calls with `github.token`. Outside this
# comment, `grep -nE 'GITHUB_TOKEN|secrets\.|id-token|packages:'` over
# this file and .github/actions/provision/action.yml matches nothing.
# Raise the scope on the one job that needs more.
permissions:
  contents: read

# Every action is pinned to a commit SHA, with the version in a trailing
# comment, because a tag is a mutable ref. `v4` moves with every v4.x
# release, and even `v4.4.0` can be force-moved, so a compromised action
# repository can point every tag at one malicious commit.
# `dtolnay/rust-toolchain@stable` is a branch, force-pushed on every Rust
# release. Update the SHA and the comment together.

jobs:
  # Decides whether a change touched anything outside the documentation
  # surface. The answer gates `grammar`, which every expensive job needs.
  # `CHANGELOG.md` and `docs/` can't go in `paths-ignore` because gates
  # read them, so a documentation change runs the `docs` job instead of
  # the platform legs, the FFI matrix and the bootstrap and seed jobs.
  #
  # It fails safe: `docs_only` is true only when every changed path
  # matches the list below. An unlisted path, or a change that can't be
  # enumerated (a force push, a first push, an API that won't answer),
  # runs everything.
  scope:
    name: Plan the run
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      docs_only: ${{ steps.q.outputs.docs_only }}
      battery: ${{ steps.q.outputs.battery }}
      matrix: ${{ steps.q.outputs.matrix }}
      special: ${{ steps.q.outputs.special }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: q
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail

          # The nightly and the button have no change set to select
          # by, and that is their job: plan the full battery without
          # asking the API anything.
          if [[ "$EVENT" == schedule || "$EVENT" == workflow_dispatch ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "a $EVENT run, so the full battery runs with no selection."
            matrix="$(python3 scripts/ci-plan.py --matrix)"
            echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
            echo "battery=true" >> "$GITHUB_OUTPUT"
            echo "special=$(python3 scripts/ci-plan.py --special | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
            mkdir -p ci-changed && : > ci-changed/full
            exit 0
          fi

          # The changed-file list comes from the API: `git diff` would
          # need `fetch-depth: 0`, which is slower here than the job it
          # might skip. Renames list both names (`previous_filename`
          # beside `filename`): the old path is a deletion as far as
          # the gates that read it are concerned.
          #
          # Both endpoints cap their file lists (300 for a compare,
          # 3,000 for a pull request) and answer a truncated list as
          # if it were whole. A list at the cap is therefore read as
          # unenumerable below, never as complete: selection from a
          # truncated list could leave out the one gate that mattered,
          # silently.
          cap=0
          if [[ -n "${PR:-}" ]]; then
            cap=3000
            files="$(gh api --paginate "repos/$REPO/pulls/$PR/files" \
                       --jq '.[] | (.filename, .previous_filename) | select(. != null)' 2>/dev/null)" || files=""
          elif [[ -n "${BEFORE:-}" && "$BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            cap=300
            files="$(gh api "repos/$REPO/compare/$BEFORE...$SHA" \
                       --jq '.files[] | (.filename, .previous_filename) | select(. != null)' 2>/dev/null)" || files=""
          else
            files=""
          fi
          if [[ -n "$files" && "$cap" != 0 ]] \
               && (( $(printf '%s\n' "$files" | wc -l) >= cap )); then
            echo "the changed-file list reached the API's $cap-file cap and may be truncated."
            files=""
          fi

          if [[ -z "$files" ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "could not enumerate the changed files, so the full battery runs."
            echo "That is this job's safe direction: an unknown change is a code change."
            matrix="$(python3 scripts/ci-plan.py --matrix)"
            echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
            echo "battery=true" >> "$GITHUB_OUTPUT"
            echo "special=$(python3 scripts/ci-plan.py --special | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
            mkdir -p ci-changed && : > ci-changed/full
            exit 0
          fi

          echo "changed files:"
          printf '%s\n' "$files" | sed 's/^/    /'
          printf '%s\n' "$files" > changed.txt

          # The documentation surface: paths that can't change what the
          # compiler does. `web/**` is listed although `paths-ignore`
          # excludes it, so a commit touching both `web/` and
          # `CHANGELOG.md` gets the right answer. `scripts/**` and
          # `tests/**` aren't here: a change to a gate or a fixture must
          # run the gates.
          outside=0
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            case "$f" in
              web/*|docs/*|assets/*|examples/README.md) ;;
              CHANGELOG.md|README.md|CONTRIBUTING.md|SECURITY.md|LICENSE) ;;
              .github/workflows/pages.yml) ;;
              *) outside=1; echo "outside the documentation surface: $f" ;;
            esac
          done <<< "$files"

          if (( outside )); then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "-> the battery runs, selected by the change set."
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "-> documentation only; the platform legs are skipped and the"
            echo "   documentation gates run in the \`docs\` job."
          fi

          mkdir -p ci-changed && cp changed.txt ci-changed/changed.txt
          if (( outside )); then
            echo "special=$(python3 scripts/ci-plan.py --changed changed.txt --special | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
            matrix="$(python3 scripts/ci-plan.py --changed changed.txt --matrix)"
            echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
            if [[ "$matrix" == *'"shard"'* ]]; then
              echo "battery=true" >> "$GITHUB_OUTPUT"
            else
              echo "battery=false" >> "$GITHUB_OUTPUT"
              echo "-> no battery gate reads this change set; the dedicated jobs still run."
            fi
          else
            # No battery on the documentation path: the `docs` job
            # runs the document gates, and an empty matrix keeps the
            # `test` job's `if:` honest about it.
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo "battery=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Hand the change set to the battery
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-changed
          path: ci-changed
          if-no-files-found: error

  grammar:
    name: Tree-sitter grammar
    # The cheap gate that fails first, and it needs no compiler.
    # Skipped on a documentation-only change. Every expensive job needs
    # this one, so one `if:` here skips them all. `scope` answers false
    # whenever it can't be sure.
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/gate-cache
      # The CLI the grammar gate shells out to (npm wrapper as locked,
      # native binary against a recorded hash). The `docs` job installs it
      # too: it runs the same gate where this job is skipped, and a gate
      # whose CLI is missing fails.
      - uses: ./.github/actions/tree-sitter

      # The grammar must accept every `.ax` file in the repository. The
      # check parses checked-in sources, so only the tree-sitter CLI is
      # needed.
      - name: Every .ax file parses under the checked-in grammar
        run: ./scripts/ci-gate.py ./scripts/check-tree-sitter.sh

      # The VS Code extension restates the parser's keywords and the
      # server's semantic token legend. The gate reads sources and the
      # extension's JSON with node, which the tree-sitter step installed,
      # and builds no compiler.
      - name: The VS Code extension agrees with the compiler
        run: ./scripts/ci-gate.py ./scripts/check-vscode.sh

      # The plan can drift where the step list could: a gate assigned
      # nowhere looks exactly like a gate that passes. This audits the
      # plan against the tree and this file against the plan. It runs
      # in the cheap job because it reads lists of file names and the
      # workflow's structure, and needs no compiler.
      - name: Every gate in the tree is planned, and this file runs the plan
        run: ./scripts/check-ci-coverage.sh

      - name: Preserve successful gates even when another gate fails
        if: ${{ !cancelled() }}
        uses: ./.github/actions/gate-cache
        with:
          mode: save

  # The other half of `scope`: on a documentation-only change, the gates
  # that read documents run here, on one runner. A gate belongs here when
  # its subject is a document, as with `check-doc-drift.sh`,
  # `check-version.sh`, `check-stdlib-api.sh` and `check-tree-sitter.sh`.
  # It builds the compiler, because most of them need one.

  docs:
    name: Documentation gates
    needs: scope
    if: needs.scope.outputs.docs_only == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AXIOM_AXC: ${{ github.workspace }}/.axiom-shared/axc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/gate-cache
      - uses: ./.github/actions/provision

      - name: Build the compiler under test once
        run: ./scripts/build-shared-axc.sh "$AXIOM_AXC"

      # The prose documents against the tree they describe.
      - name: The documents state what the tree does
        run: ./scripts/ci-gate.py ./scripts/check-doc-drift.sh

      # Several of the version sites are documents: README.md, SECURITY.md
      # and docs/.
      - name: Every site states the same version
        run: ./scripts/ci-gate.py ./scripts/check-version.sh

      # `docs/stdlib-api.md` is `axdoc`'s output, so a hand edit to it is
      # drift this catches.
      - name: The stdlib API reference is what the library says
        run: ./scripts/ci-gate.py ./scripts/check-stdlib-api.sh

      # The documents carry `.ax` blocks, and the grammar must parse them.
      # `grammar` is skipped on this path, so the CLI is installed here.
      - uses: ./.github/actions/tree-sitter
      - name: Every .ax file parses under the checked-in grammar
        run: ./scripts/ci-gate.py ./scripts/check-tree-sitter.sh

      # README.md carries the supported-target list and the rule that
      # defines "supported"; `install.sh`'s refusals are held to it.
      - name: The release matrix and the installer's refusals agree
        run: ./scripts/ci-gate.py ./scripts/check-release-targets.sh

      - name: The installer installs, and refuses what it should
        run: ./scripts/ci-gate.py ./scripts/check-install.sh

      - name: Preserve successful gates even when another gate fails
        if: ${{ !cancelled() }}
        uses: ./.github/actions/gate-cache
        with:
          mode: save

  # The compiler under test, built once per platform and handed to
  # every shard as an artifact. The old layout built it inside each of
  # eight shard jobs (and re-bootstrapped the seed compiler in some
  # twenty jobs besides); the stamp `build-shared-axc.sh` writes is
  # what lets a shard trust the hand-off, and `check-gate-lib.sh` in
  # the battery proves a stale artifact is refused.
  #
  # Ninety-eight of the gates build the compiler under test from
  # `core/`. This job builds it once, and `gate_build_axc` in each
  # gate reuses it while the tree's source stamp matches, rebuilds
  # when it doesn't, and refuses a path that names no build product.
  # So an ablation of `core/` stays visible to every gate, and a
  # mis-set variable can't read as a quiet success.
  # `scripts/check-gate-lib.sh` is the probe.
  build:
    name: Build the compiler (${{ matrix.name }})
    needs: grammar
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-aarch64
            os: ubuntu-24.04-arm
          - name: darwin-aarch64
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      AXIOM_AXC: ${{ github.workspace }}/.axiom-shared/axc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/provision

      # Reuse a stamped build for these exact sources. The stamp check
      # in the consumer is the correctness condition; this key only
      # has to be a good guess about when the stamp will match.
      - name: Restore a stamped compiler for these sources
        id: axc-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .axiom-shared
          key: axiom-axc-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('core/**', 'stdlib/**', 'bootstrap/**', 'scripts/lib/**', 'scripts/build-shared-axc.sh') }}

      # Built before anything that needs it. A failure here is a
      # compiler that doesn't build from the tree, reported once here
      # instead of once per gate.
      - name: Build the compiler under test once
        if: steps.axc-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-shared-axc.sh "$AXIOM_AXC"

      - name: Save the stamped compiler
        if: steps.axc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .axiom-shared
          key: ${{ steps.axc-cache.outputs.cache-primary-key }}

      - name: Record the native build inputs
        id: toolchain
        run: |
          python3 scripts/record-toolchain.py --target "${{ matrix.name }}" \
            --compiler "$AXIOM_AXC" --output "$RUNNER_TEMP/toolchain-${{ matrix.name }}.json"
          python3 scripts/record-toolchain.py --target "${{ matrix.name }}" \
            --compiler "$AXIOM_AXC" --verify "$RUNNER_TEMP/toolchain-${{ matrix.name }}.json"

      - name: Preserve the native toolchain record
        if: steps.toolchain.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: toolchain-${{ matrix.name }}
          path: ${{ runner.temp }}/toolchain-${{ matrix.name }}.json
          if-no-files-found: error

      - name: Hand the compilers to the battery
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: axc-${{ matrix.name }}
          path: |
            .axiom-shared/axc
            .axiom-shared/axc.stamp
            .axiom-bin/axiom
          if-no-files-found: error

  # The battery: `ci-plan.py` has assigned every gate to a shard and,
  # on a push or a pull request, selected the gates whose inputs the
  # change touches. This job regenerates the same plan from the same
  # commit and change set, then `ci-run.py` executes it - gates in
  # parallel, the serial set afterwards, each gate through
  # `ci-gate.py` so an unchanged gate reuses its recorded pass.
  test:
    name: Test (${{ matrix.name }}/${{ matrix.shard }})
    needs: [scope, build]
    if: needs.scope.outputs.battery == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      AXIOM_AXC: ${{ github.workspace }}/.axiom-shared/axc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/gate-cache
        with:
          namespace: -${{ matrix.name }}-shard-${{ matrix.shard }}

      # LLVM only: the compilers arrive as artifacts, so no shard
      # re-bootstraps the seed or rebuilds the compiler under test.
      - uses: ./.github/actions/provision
        with:
          bootstrap: 'false'

      # The tree-sitter CLI and the lockfile-pinned TextMate engine are
      # for the highlighting parity gate; installing them in every
      # shard keeps the shard shape uniform and costs seconds against
      # a special-cased one.
      - uses: ./.github/actions/tree-sitter
      - name: Install the TextMate engine the parity gate runs
        run: npm ci --prefix scripts/lib/highlight-parity --ignore-scripts

      - name: Fetch the built compilers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: axc-${{ matrix.name }}

      - name: Fetch the change set the plan was made from
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-changed
          path: ${{ runner.temp }}/ci-changed

      # The stdlib goldens are a battery of their own, not a gate
      # script, so the plan cannot shard them; shard 1 carries them on
      # each platform, against the shared compiler, as before.
      - name: Standard-library golden tests
        if: matrix.shard == 1
        run: |
          chmod +x .axiom-shared/axc .axiom-bin/axiom
          ./scripts/run-stdlib-tests.sh

      - name: Run this shard of the battery
        run: |
          chmod +x .axiom-shared/axc .axiom-bin/axiom
          changed="$RUNNER_TEMP/ci-changed/changed.txt"
          if [[ -f "$changed" ]]; then
            python3 scripts/ci-plan.py --changed "$changed" \
              --shards "${{ matrix.shards }}" --shard "${{ matrix.shard }}" \
              > "$RUNNER_TEMP/gates.txt"
          else
            python3 scripts/ci-plan.py \
              --shards "${{ matrix.shards }}" --shard "${{ matrix.shard }}" \
              > "$RUNNER_TEMP/gates.txt"
          fi
          echo "this shard runs $(wc -l < "$RUNNER_TEMP/gates.txt" | tr -d ' ') gates:"
          sed 's/^/    /' "$RUNNER_TEMP/gates.txt"
          python3 scripts/ci-run.py --gates "$RUNNER_TEMP/gates.txt" \
            --results "$RUNNER_TEMP/ci-results/results.jsonl" \
            --logs "$RUNNER_TEMP/ci-results/logs"

      - name: Preserve gate results and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gates-${{ matrix.name }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/ci-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Preserve successful gates even when another gate fails
        if: ${{ !cancelled() }}
        uses: ./.github/actions/gate-cache
        with:
          mode: save
          namespace: -${{ matrix.name }}-shard-${{ matrix.shard }}


  test-results:
    name: Tests (${{ matrix.name }})
    needs: [grammar, test]
    if: ${{ always() && needs.grammar.result == 'success' }}
    strategy:
      matrix:
        name: [linux-aarch64, darwin-aarch64]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Every test shard succeeded
        env:
          SHARDS_RESULT: ${{ needs.test.result }}
        run: test "$SHARDS_RESULT" = success

  # `pkg/axiom-oxide/` is a cargo workspace with a trybuild suite and a bindgen
  # snapshot suite. `scripts/check-ffi.sh` is the gate
  # `docs/memory-model.md` MM-FFI-5 requires: it enumerates the external
  # symbols the FFI opens rather than forbidding all of them.

  ffi:
    name: FFI (${{ matrix.name }})
    # A dedicated job follows the same selection as the battery: it
    # starts only when the change meets its gate's inputs. The gate
    # itself still always runs fresh - selection decides relevance,
    # never trusts a recorded pass.
    needs: [scope, grammar]
    if: contains(needs.scope.outputs.special, 'check-ffi.sh')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: darwin-aarch64
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # `toolchain: stable` is spelled out because the ref is a SHA. The
      # action's branches are toolchain names and `stable` is force-pushed
      # on every Rust release, so the SHA freezes the action code at a
      # reviewed commit. The action reads `inputs.toolchain`, never
      # `github.action_ref`, so naming it keeps stable installed if the
      # default changes.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
        with:
          toolchain: stable
      # The declared minimum, installed beside stable, because a minimum
      # nothing builds on is a guess. The version is read from
      # `pkg/axiom-oxide/Cargo.toml` so the two can't disagree. `check-ffi.sh` fails
      # under CI without this toolchain, so deleting the step turns the
      # job red.
      - name: Install the Rust minimum pkg/axiom-oxide/Cargo.toml declares
        run: rustup toolchain install "$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' pkg/axiom-oxide/Cargo.toml)" --profile minimal
      - uses: ./.github/actions/provision

      # The three tiers the gate prices, the generated binding diffed
      # against the checked-in one, the allowlist with its negative
      # probes, and a Rust binary calling into an Axiom archive.
      - name: The FFI opens exactly the door it declares
        run: ./scripts/check-ffi.sh

      # The crates' own suites: the classifier's unit tests, the trybuild
      # bank of rejected `#[axiom_export]` shapes, and the bindgen
      # snapshots. `axiom-host` is excluded because it links an Axiom
      # archive that check-ffi.sh builds, not cargo.
      - name: The FFI crates' own tests
        run: cd pkg/axiom-oxide && cargo test --workspace --exclude axiom-host

  # ---------------------------------------------------------------
  # FreeBSD is source-only (README, Targets), like linux-x86_64. This job
  # builds the compiler from `bootstrap/axiom-freebsd-x86_64.ll` in a
  # KVM-accelerated FreeBSD 14 VM, runs it to a fixpoint and runs one
  # program, with no test battery. `check-release-targets.sh` requires
  # this leg by name.
  #
  # The action's SHA pins the code that boots the VM, not the disk image,
  # which vmactions fetches at run time (`release: "14.4"`). The job's
  # reach is bounded like every job here: `contents: read`, no secret, no
  # upload.
  #
  # `prepare` and `run` execute under sh in the VM. The bootstrap is bash,
  # `llc` comes from the LLVM package under `/usr/local/llvm*/bin`, and
  # `cc` is the base system's clang.
  # ---------------------------------------------------------------
  test-freebsd:
    name: Bootstrap from seed (freebsd-x86_64)
    needs: grammar
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Bootstrap from the seed on FreeBSD 14
        uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1 # v1.5.5
        with:
          release: "14.4"
          copyback: false
          prepare: |
            pkg install -y bash llvm python3
          run: |
            set -e
            export PATH="$(ls -d /usr/local/llvm*/bin | sort -V | tail -1):$PATH"
            uname -a; llc --version | head -2; cc --version | head -1
            ./scripts/bootstrap-from-seed.sh --install .axiom-bin

  # freebsd-aarch64 is on the same tier: the same bootstrap in a FreeBSD
  # 14.4 VM, with `arch: aarch64`. The guest is emulated, 10 to 30 times
  # slower than the KVM guest above, so the leg runs the bootstrap alone,
  # with a longer budget. The x86_64 bootstrap takes under four minutes,
  # so even the slow end of emulation fits inside it.
  # ---------------------------------------------------------------
  test-freebsd-aarch64:
    name: Bootstrap from seed (freebsd-aarch64)
    needs: grammar
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/stable'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Bootstrap from the seed on FreeBSD 14 (aarch64, emulated)
        uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1 # v1.5.5
        with:
          release: "14.4"
          arch: aarch64
          copyback: false
          prepare: |
            pkg install -y bash llvm python3
          run: |
            set -e
            export PATH="$(ls -d /usr/local/llvm*/bin | sort -V | tail -1):$PATH"
            uname -a; llc --version | head -2; cc --version | head -1
            ./scripts/bootstrap-from-seed.sh --install .axiom-bin

  cross:
    name: Cross-target codegen
    # Selected like the battery, on either gate this job runs. The
    # Windows jobs need this one's artifact, so they skip with it.
    needs: [scope, grammar]
    if: contains(needs.scope.outputs.special, 'check-cross-targets.sh') || contains(needs.scope.outputs.special, 'check-windows-hello.sh')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/gate-cache
      - uses: ./.github/actions/provision

      # Every target's IR must at least assemble from a single host: the
      # standard library picks syscall numbers by target, and a typo in a
      # platform module is otherwise invisible until someone builds on
      # that platform.

      - name: Assemble every target from one host
        run: ./scripts/ci-gate.py ./scripts/check-cross-targets.sh

      # The Windows modules, emitted where the tree's compiler runs: the
      # hello for windows-x86_64 and windows-aarch64, the compiler for
      # windows-x86_64, and the tree audit's report over its fixture.
      # The `windows` job links and runs them.
      - name: Emit the Windows hello, the compiler and the tree audit
        run: ./scripts/check-windows-hello.sh --emit windows-hello

      - name: Hand the Windows modules to the Windows job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-hello
          path: windows-hello
          if-no-files-found: error
          retention-days: 7

      - name: Preserve successful gates even when another gate fails
        if: ${{ !cancelled() }}
        uses: ./.github/actions/gate-cache
        with:
          mode: save

  # windows-x86_64 executed: the hello links and runs, the compiler the
  # `cross` job emitted links with an 8 MB stack and emits itself byte
  # for byte, builds and runs hello through its own driver, contains
  # every failure in `tests/testrunner/mixed-tests.ax`, and audits a
  # fixture tree to the report the emitting host printed. A separate
  # seeded ladder reaches its own fixpoint and reproduces the host
  # emission too. The windows-arm job executes the same checks on aarch64.
  windows:
    name: Windows x86_64 execution
    needs: cross
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-hello
          path: windows-hello

      # LLVM's own release archive, held to the digest the release
      # records, at the major the macOS leg runs. Its zstd frame needs a
      # 1 GiB window, hence `--long=30`. Only the five tools the gate and
      # the compiler's driver call are unpacked.
      - name: Install LLVM 23.1.3
        run: |
          set -euo pipefail
          version=23.1.3
          dir="clang+llvm-$version-x86_64-pc-windows-msvc"
          want=7e69dc07a4536b79ff24a651a2611990bf8eaab17ea560f1092707c4f31ba01d
          command -v zstd > /dev/null || { echo "::error::zstd is not on PATH"; exit 1; }
          mkdir -p .llvm
          curl -fsSL --retry 3 -o .llvm/llvm.tar.zst \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-$version/$dir.tar.zst"
          got="$(sha256sum .llvm/llvm.tar.zst | cut -d' ' -f1)"
          if [[ "$got" != "$want" ]]; then
            echo "::error::$dir.tar.zst hashes to $got, not $want"
            exit 1
          fi
          zstd -d --long=30 -c .llvm/llvm.tar.zst | tar -x -f - -C .llvm --strip-components=2 \
            "$dir/bin/llc.exe" "$dir/bin/opt.exe" "$dir/bin/lld-link.exe" \
            "$dir/bin/llvm-dlltool.exe" "$dir/bin/llvm-readobj.exe"
          rm .llvm/llvm.tar.zst
          cygpath -w "$PWD/.llvm" >> "$GITHUB_PATH"

      - name: Record the toolchain
        run: |
          for tool in llc opt lld-link llvm-dlltool llvm-readobj; do
            printf '%-13s %s\n' "$tool" "$(command -v "$tool")"
          done
          llc --version | head -2
          got="$(llc --version | sed -n 's/.*LLVM version \([0-9][0-9]*\).*/\1/p' | head -1)"
          if [[ "$got" != 23 ]]; then
            echo "::error::expected LLVM 23, found ${got:-none}"
            exit 1
          fi

      - name: Bootstrap the Windows x86_64 compiler from its committed seed
        id: seed
        run: |
          set -euo pipefail
          target=windows-x86_64
          printf 'Shell machine: %s; PROCESSOR_ARCHITECTURE=%s; PROCESSOR_ARCHITEW6432=%s\n' \
            "$(uname -m)" "${PROCESSOR_ARCHITECTURE:-unset}" "${PROCESSOR_ARCHITEW6432:-unset}"
          seeded="$(cygpath -u "$RUNNER_TEMP")/axiom-seeded-$target"
          ./scripts/bootstrap-from-seed.sh --install "$seeded"
          llvm-readobj --file-headers "$seeded/axiom.exe" | grep -F 'Machine: IMAGE_FILE_MACHINE_AMD64 ('
          export AXIOM_STDLIB="$(cygpath -m "$PWD/stdlib")"
          unset AXIOM_PATH
          "$seeded/axiom.exe" --diagnostic-format=ai --target="$target" emit-llvm core/main.ax -o "$seeded/current.ll"
          cmp "$seeded/current.ll" "windows-hello/selfhost/axiom-$target.ll"
          printf 'compiler=%s\n' "$(cygpath -m "$seeded/axiom.exe")" >> "$GITHUB_OUTPUT"

      - name: Run the Windows hello, the compiler and the tree audit
        run: ./scripts/check-windows-hello.sh --run windows-hello windows-x86_64

      - name: Preserve Windows x86_64 probe failures
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-probe-failures-x86_64
          path: windows-hello/failures/windows-x86_64
          if-no-files-found: ignore

      - name: Package and install the Windows x86_64 CI preview
        id: install
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        shell: pwsh
        env:
          AXIOM_SEEDED_COMPILER: ${{ steps.seed.outputs.compiler }}
        run: ./scripts/check-windows-install.ps1 -Compiler "$env:AXIOM_SEEDED_COMPILER" -Target windows-x86_64 -Output "$env:RUNNER_TEMP/windows-preview"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        with:
          name: windows-preview-x86_64
          path: |
            ${{ runner.temp }}/windows-preview/axiom-*.zip
            ${{ runner.temp }}/windows-preview/axiom-*.zip.sha256
          if-no-files-found: error


  # The same half on an arm64 runner: GitHub's `windows-11-arm` image,
  # LLVM's aarch64 Windows archive, and the hello case executed for
  # windows-aarch64. One job per architecture because a runner executes
  # its own architecture's image and no other.
  windows-arm:
    name: Windows aarch64 execution
    needs: cross
    runs-on: windows-11-arm
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-hello
          path: windows-hello

      # LLVM's own release archive, held to the digest the release
      # records, at the major the macOS leg runs. Its zstd frame needs a
      # 1 GiB window, hence `--long=30`. Only the five tools the gate and
      # the compiler's driver call are unpacked.
      - name: Install LLVM 23.1.3
        run: |
          set -euo pipefail
          version=23.1.3
          dir="clang+llvm-$version-aarch64-pc-windows-msvc"
          want=667b881302a4e041d3034601a9055202edd8a866afaaaac6017682fba587f5f4
          command -v zstd > /dev/null || { echo "::error::zstd is not on PATH"; exit 1; }
          mkdir -p .llvm
          curl -fsSL --retry 3 -o .llvm/llvm.tar.zst \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-$version/$dir.tar.zst"
          got="$(sha256sum .llvm/llvm.tar.zst | cut -d' ' -f1)"
          if [[ "$got" != "$want" ]]; then
            echo "::error::$dir.tar.zst hashes to $got, not $want"
            exit 1
          fi
          zstd -d --long=30 -c .llvm/llvm.tar.zst | tar -x -f - -C .llvm --strip-components=2 \
            "$dir/bin/llc.exe" "$dir/bin/opt.exe" "$dir/bin/lld-link.exe" \
            "$dir/bin/llvm-dlltool.exe" "$dir/bin/llvm-readobj.exe"
          rm .llvm/llvm.tar.zst
          cygpath -w "$PWD/.llvm" >> "$GITHUB_PATH"

      - name: Record the toolchain
        run: |
          for tool in llc opt lld-link llvm-dlltool llvm-readobj; do
            printf '%-13s %s\n' "$tool" "$(command -v "$tool")"
          done
          llc --version | head -2
          got="$(llc --version | sed -n 's/.*LLVM version \([0-9][0-9]*\).*/\1/p' | head -1)"
          if [[ "$got" != 23 ]]; then
            echo "::error::expected LLVM 23, found ${got:-none}"
            exit 1
          fi

      # The windows-aarch64 half of what the x86_64 leg does: the hello
      # case, the compiler built for this architecture from the IR the
      # cross job emitted, the tree audit and the battery.
      - name: Bootstrap the Windows aarch64 compiler from its committed seed
        id: seed
        run: |
          set -euo pipefail
          target=windows-aarch64
          printf 'Shell machine: %s; PROCESSOR_ARCHITECTURE=%s; PROCESSOR_ARCHITEW6432=%s\n' \
            "$(uname -m)" "${PROCESSOR_ARCHITECTURE:-unset}" "${PROCESSOR_ARCHITEW6432:-unset}"
          seeded="$(cygpath -u "$RUNNER_TEMP")/axiom-seeded-$target"
          ./scripts/bootstrap-from-seed.sh --install "$seeded"
          llvm-readobj --file-headers "$seeded/axiom.exe" | grep -F 'Machine: IMAGE_FILE_MACHINE_ARM64 ('
          export AXIOM_STDLIB="$(cygpath -m "$PWD/stdlib")"
          unset AXIOM_PATH
          "$seeded/axiom.exe" --diagnostic-format=ai --target="$target" emit-llvm core/main.ax -o "$seeded/current.ll"
          cmp "$seeded/current.ll" "windows-hello/selfhost/axiom-$target.ll"
          printf 'compiler=%s\n' "$(cygpath -m "$seeded/axiom.exe")" >> "$GITHUB_OUTPUT"

      - name: Run the Windows aarch64 hello, the compiler and the tree audit
        run: ./scripts/check-windows-hello.sh --run windows-hello windows-aarch64

      - name: Preserve Windows aarch64 probe failures
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-probe-failures-aarch64
          path: windows-hello/failures/windows-aarch64
          if-no-files-found: ignore

      - name: Package and install the Windows aarch64 CI preview
        id: install
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        shell: pwsh
        env:
          AXIOM_SEEDED_COMPILER: ${{ steps.seed.outputs.compiler }}
        run: ./scripts/check-windows-install.ps1 -Compiler "$env:AXIOM_SEEDED_COMPILER" -Target windows-aarch64 -Output "$env:RUNNER_TEMP/windows-preview"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        with:
          name: windows-preview-aarch64
          path: |
            ${{ runner.temp }}/windows-preview/axiom-*.zip
            ${{ runner.temp }}/windows-preview/axiom-*.zip.sha256
          if-no-files-found: error

  bootstrap:
    name: Self-hosting fixpoint
    needs: grammar
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/provision

      # `stage2 == stage3`: the self-hosting fixpoint.

      - name: stage2 and stage3 are byte-identical
        run: ./scripts/check-bootstrap.sh

      - name: Poisoned allocator generations reproduce the compiler
        env:
          AXIOM: ${{ github.workspace }}/.axiom-bin/axiom
        run: ./scripts/check-poisoned-alloc.sh

  # `bootstrap` proves the seed can build this source. This proves the
  # seed is the output of source in this repository's history: it
  # regenerates every declared seed from the commit that last wrote them and
  # requires byte-identity. It has its own job because it needs
  # `fetch-depth: 0` and a compiler build plus the target-specific
  # emissions.
  #
  # One leg: the seed is generated on darwin-aarch64, so regenerating it
  # on ubuntu already gives two operating systems, and
  # `check-seed-provenance.sh` prints which case each run is. Add a darwin
  # leg if the generating host moves.
  seed-provenance:
    name: The seed is its source's emission
    needs: grammar
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/provision

      # The same gate the `test` matrix runs, here for one arm: its
      # section 5 compares the anchor's stated size against `bb730db`,
      # which a depth-1 checkout lacks. There it compares only the prose
      # sites to each other; here, with `fetch-depth: 0`, it counts the
      # commit.
      - name: The anchor's stated size, against the anchor
        run: ./scripts/check-seed-supply-chain.sh

      - name: Regenerate every seed from the source it came from
        run: ./scripts/check-seed-provenance.sh

  # The seed's ancestry: the compiler that emitted the seed is on a chain
  # that begins outside Axiom. It replays the rows of `bootstrap/CHAIN`
  # that `bootstrap/CHAIN.checkpoint` doesn't certify, always including
  # the newest. `scripts/check-seed-lineage.sh` recomputes the
  # checkpoint's digest first, so editing a covered row voids it and
  # forces a full replay. `fetch-depth: 0` because it walks the history of
  # `bootstrap/*.ll`.
  #
  # It runs only when the change touched `bootstrap/`, asked of git rather
  # than a `paths:` filter, which would gate every job, or a third-party
  # changed-files action, which would be one more supply-chain dependency.
  # With no base to diff against it runs; when it skips, it says so.
  seed-lineage:
    name: The seed reproduces from the seed before it
    needs: grammar
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Did this change touch bootstrap/?
        id: touched
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then
            range="origin/$BASE_REF...HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            range="$BEFORE..HEAD"
          else
            echo "no base to diff against; replaying"
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$range" -- bootstrap/ | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip: $range touches nothing under bootstrap/; the newest link was replayed when it landed"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/provision
        if: steps.touched.outputs.run == 'true'
      - name: The uncertified rows of bootstrap/CHAIN replay
        if: steps.touched.outputs.run == 'true'
        run: ./scripts/check-seed-lineage.sh

  # Every row from the Rust anchor: cargo builds the compiler at
  # `bb730db`, it reproduces the first seed, and each later seed is
  # reproduced from the one before. Nightly and on the button.
  #
  # It never blesses `bootstrap/CHAIN.checkpoint`: a gate that advances
  # its own trust anchor proves nothing, and `contents: read` can't
  # commit one. A person does, with
  # `AXIOM_BLESS=1 scripts/check-seed-lineage.sh --full`, in a reviewed
  # diff. This job re-derives every row whatever the checkpoint says, so
  # a wrongly certified prefix is caught within a day.
  # `dtolnay/rust-toolchain` uses the same SHA as the `ffi` job.
  seed-lineage-full:
    name: The seed lineage replays from the Rust anchor
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
        with:
          toolchain: stable
      - uses: ./.github/actions/provision
      - name: Every row of bootstrap/CHAIN replays, and the anchor's probes go red
        run: ./scripts/check-seed-lineage.sh --full

  # The long evidence. A push runs samples: the fuzzer's 600 mutants, the
  # model's traces at `--opt` 0 and 3, and the protocol model at small
  # bounds. The full budgets (6,000 mutants, every trace at every level,
  # the larger protocol bounds) take minutes each, so they run nightly and
  # on the button. A red here is a red like any other.
  long-evidence:
    name: The fuzzer's full budget and the model's every trace
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/provision
      - name: 6,000 mutants of the corpus, each held to check answering
        run: ./scripts/check-fuzz.sh --long
      - name: Every model trace at every --opt level
        run: ./scripts/check-runtime-model.sh --long
      - name: The metamorphic relation over the compiler and every stdlib module
        run: ./scripts/check-metamorphic.sh --long
      - name: The reclamation soak at ten million replacements
        run: ./scripts/check-reclaim-soak.sh --long
      - name: The protocol model at its larger bounds, and longer liveness runs
        run: ./scripts/check-protocol-model.sh --long

  reproducible:
    name: Reproducible build
    needs: grammar
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/provision

      - name: Byte-identical output from two independent runs
        run: ./scripts/check-reproducible.sh

  # ---------------------------------------------------------------
  # The load-bearing job: it tests the provisioning every other job relies
  # on, `seed -> stage1 -> stage2 -> stage3`, byte-identical at the top,
  # plus a program compiled and run by the result. Green means a clean
  # checkout builds Axiom with only `llc` and a C linker. A stale seed
  # fails here; `scripts/reseed.sh` is the fix. Both architectures run
  # because the seed is per-target. For linux-x86_64, a source-only
  # target, this leg is the whole promise, and `check-release-targets.sh`
  # requires it.
  # ---------------------------------------------------------------
  bootstrap-no-rust:
    name: Bootstrap from seed (${{ matrix.name }})
    needs: grammar
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: darwin-aarch64
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Not `./.github/actions/provision`: that action installs the
      # result, and this job tests the build itself.
      # The same pinned LLVM majors as the provisioning action.
      - name: Install LLVM tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18 clang-18
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"
      - name: Install LLVM tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@23
          echo "$(brew --prefix llvm@23)/bin" >> "$GITHUB_PATH"
      - name: Record the toolchain
        run: llc --version | head -2
      - name: Build the compiler from the committed seed
        run: ./scripts/bootstrap-from-seed.sh

  # The one check a branch protection rule names. It is green exactly
  # when nothing this run needed failed or was cancelled; jobs a
  # condition legitimately skipped (docs-only, an unselected leg) do
  # not redden it, and their own rows still show what ran.
  ci:
    name: CI
    needs:
      - scope
      - grammar
      - docs
      - build
      - test
      - test-results
      - ffi
      - test-freebsd
      - test-freebsd-aarch64
      - cross
      - windows
      - windows-arm
      - bootstrap
      - seed-provenance
      - seed-lineage
      - seed-lineage-full
      - long-evidence
      - reproducible
      - bootstrap-no-rust
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every needed job succeeded or was legitimately skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$NEEDS" | python3 -c "
          import json, sys
          needs = json.load(sys.stdin)
          bad = [k for k, v in sorted(needs.items()) if v['result'] in ('failure', 'cancelled')]
          for k, v in sorted(needs.items()):
              print(v['result'].ljust(10), k)
          if bad:

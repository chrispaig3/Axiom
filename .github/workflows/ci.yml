name: CI

# Staged so that a cheap failure is reported before an expensive one:
# formatting and lints gate the test job, and the test job gates the
# cross-platform matrix. Every job needs `llc` and a linker, because the
# interesting tests compile and *run* Axiom programs rather than only
# type-checking them - a syscall lowering that assembles but returns the
# wrong value is exactly the class of bug a type-check-only CI misses.

on:
  push:
    # `trunk` is this repository's only branch. This said `main` from
    # the day the workflow was added, so no push had ever triggered a
    # run - the gates were green only on pull requests and local
    # batteries, and a week of self-hosting work landed with CI
    # structurally silent. A trigger that names a branch that does
    # not exist is indistinguishable in the checks tab from a quiet
    # success.
    branches: [trunk]
  pull_request:
  # The nightly and the button exist for ONE job, `seed-lineage-full`:
  # replaying every row of `bootstrap/CHAIN` from the Rust anchor is
  # forty minutes and needs cargo, which is a poor neighbour for a pull
  # request and the wrong cadence for a table that moves at a reseed.
  # Every other job `needs: grammar`, and `grammar` is skipped on these
  # two triggers, so they run nothing else - a skipped `needs` skips
  # its dependents.
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

# No `env:` block. It used to set `CARGO_TERM_COLOR` and `RUSTFLAGS: -D
# warnings`, both of which outlived the Rust compiler they configured.
# Cargo is back - the FFI workspace under `rust/` is a cargo workspace,
# and the `ffi` job below builds and tests it - but a repository-wide
# `-D warnings` is not the promise those crates want, and the
# reproducibility property the old block claimed is gated for real by
# `scripts/check-reproducible.sh`.

# The token every job runs with. There was no `permissions:` block
# anywhere in this file, which does not mean "no permissions" - it means
# each job holds whatever the repository default grants, and for a
# repository created before GitHub changed that default it is
# read/write on `contents`. That token sat in the environment of the
# `grammar` job below while it ran an unpinned npm package's install
# script, on every pull request, before any other job started.
#
# `contents: read` is enough for every job, checked rather than
# assumed: every one of them checks the tree out, provisions a compiler
# from `bootstrap/`, and runs a script under `scripts/`. None pushes,
# opens a comment, cuts a release or reads a secret - `grep -nE
# 'GITHUB_TOKEN|secrets\.|id-token|packages:'` over this file and
# .github/actions/provision/action.yml matches nothing. The one artifact
# here - the Windows modules `cross` hands to the `windows` job - moves
# on the workflow's own run-scoped token and needs no `permissions`
# entry. Adding a job that needs more should raise the scope on THAT
# job, not here.
permissions:
  contents: read

# Third-party and first-party actions alike are pinned to a commit SHA
# with the version in a trailing comment, because a tag is a mutable ref
# on GitHub: `v4` is deliberately re-pointed at every v4.x release, and
# even a full `v4.4.0` can be force-moved by whoever holds the
# repository. The 2025 tj-actions/changed-files compromise was exactly
# that - every version tag moved to one malicious commit - so a tag pin
# would not have helped and a SHA pin would have. `dtolnay/rust-toolchain`
# is worse than a tag: `stable` is a BRANCH, force-pushed on every Rust
# release, so `@stable` was running whatever it pointed at that morning.
# Update these by editing both the SHA and the comment together.

jobs:
  # The cheap gate that fails first. It used to be `cargo fmt` and
  # `cargo clippy` over the Rust compiler; with that compiler deleted,
  # the equivalent cheap check is the one thing here that needs no
  # compiler at all - the tree-sitter grammar must still parse every
  # `.ax` file in the repository. A grammar that has drifted from the
  # parser is the failure this catches before anything expensive runs.
  grammar:
    name: Tree-sitter grammar
    # Not on the nightly or the button: those are `seed-lineage-full`'s,
    # and skipping this job skips the nine that need it.
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # The grammar has to accept every `.ax` file in the repository.
      # Nothing here compiles anything: the check parses checked-in
      # sources, so only the tree-sitter CLI is needed.
      #
      # This was `npm install --prefix tree-sitter-axiom --no-save
      # tree-sitter-cli`, and it was three missing pins in one line, in
      # the job that gates every other job, on every pull request.
      # Measured 2026-08-23: no version on the command line, so npm
      # resolved the `latest` dist-tag and installed 0.26.13 rather than
      # the ^0.26.12 the manifest asked for; `--no-save` plus a
      # `.gitignore` entry for the lockfile meant nothing was pinned by
      # hash on any run; and the install script it then ran fetched
      # tree-sitter-macos-arm64.gz from a GitHub release and unpacked a
      # 20 MB executable that the next step runs.
      #
      # `npm ci` installs exactly what package-lock.json says, verifies
      # every tarball against the lockfile's integrity hash, and REFUSES
      # if the lockfile and the manifest disagree - which is what makes
      # it the right verb in CI and `npm install` the wrong one, because
      # `install` silently rewrites the lockfile to whatever it resolved.
      - name: Install the CLI's npm wrapper, exactly as locked
        run: npm ci --prefix tree-sitter-axiom --ignore-scripts

      # `--ignore-scripts` above suppresses the download, so the wrapper
      # `npm ci` just installed - node_modules/.bin/tree-sitter, which is
      # a four-line cli.js that spawns `./tree-sitter` beside itself -
      # has nothing to spawn. This step puts the binary there, which is
      # the same path install.js would have written, so
      # scripts/check-tree-sitter.sh finds it by its existing
      # project-local lookup and needs no change.
      #
      # WHY BOTH HALVES ARE NEEDED. The lockfile pins the npm tarball,
      # but that tarball is 21 KB of JavaScript - `npm view
      # tree-sitter-cli@0.26.12 dist.unpackedSize` is 21855 - and the
      # binary is not in it and has no npm integrity hash anywhere.
      # There are no per-platform binary packages to depend on either
      # (`optionalDependencies` is null). So the executable that does
      # all the work is the one thing npm cannot pin, and a GitHub
      # release asset is mutable: it can be deleted and re-uploaded at
      # the same URL by anyone holding that repository. Hence a checked-in
      # SHA256, verified BEFORE the bytes are decompressed or made
      # executable, in the shape scripts/bootstrap-from-seed.sh already
      # uses for bootstrap/SHA256SUMS.
      #
      # The version is read from the package npm just installed - the
      # same expression install.js uses - so the binary can never be a
      # different version from the wrapper. Bumping the CLI therefore
      # fails HERE, on an unrecorded hash, until the table below is
      # updated too. That is the intended way to find out.
      - name: Install the tree-sitter binary it execs, against a recorded hash
        run: |
          set -euo pipefail
          cli=tree-sitter-axiom/node_modules/tree-sitter-cli
          version="$(node -p "require('./$cli/package.json').version")"

          case "$(uname -s)/$(uname -m)" in
            Linux/x86_64)  asset=tree-sitter-linux-x64.gz   ;;
            Linux/aarch64) asset=tree-sitter-linux-arm64.gz ;;
            Darwin/arm64)  asset=tree-sitter-macos-arm64.gz ;;
            Darwin/x86_64) asset=tree-sitter-macos-x64.gz   ;;
            *) echo "no recorded hash for $(uname -s)/$(uname -m)" >&2; exit 1 ;;
          esac

          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          # sha256(1) of the release assets as served, for v0.26.12.
          # All four are recorded, not just the linux-x64 this job runs
          # on, so moving the job to another runner is an edit to
          # `runs-on` and not to the trust story - the same reason
          # bootstrap/SHA256SUMS carries six seeds to run one.
          cat > "$work/RECORDED" <<'SUMS'
          d00ac0daefc4bf8c4b57842a5c0509927232faad1d83157b64fbad4e2e8d9a8b  tree-sitter-linux-x64.gz
          cfbf3d9aad8e326878ab1846885a9c2b782a0333273591616f34bf556d525586  tree-sitter-linux-arm64.gz
          a7ddeff2507391ebdfd0b8fa0dfe91babed291ea00d86426cb0e6cfade891697  tree-sitter-macos-arm64.gz
          6827b218bce4d5403cb76ae3c269bc836d3124b75bb3477197ee9a8c8f6e79dc  tree-sitter-macos-x64.gz
          SUMS

          # Only the line for this platform, so a missing entry is an
          # error rather than a check that passes over nothing. `-c`
          # with a file naming three absent assets succeeds on GNU
          # coreutils with --ignore-missing and fails without it; a
          # one-line file needs neither and behaves the same under
          # BSD/perl shasum, which has no such flag.
          grep "  $asset\$" "$work/RECORDED" > "$work/SHA256SUMS" \
            || { echo "no recorded hash for $asset at v$version" >&2; exit 1; }

          curl --fail --silent --show-error --location \
               --proto '=https' --tlsv1.2 \
               -o "$work/$asset" \
               "https://github.com/tree-sitter/tree-sitter/releases/download/v$version/$asset"

          # Same fallback as scripts/bootstrap-from-seed.sh: sha256sum
          # is coreutils and absent from macOS, shasum is perl and
          # present on both.
          if command -v sha256sum > /dev/null; then
            sumcheck() { sha256sum -c SHA256SUMS; }
          else
            sumcheck() { shasum -a 256 -c SHA256SUMS; }
          fi
          ( cd "$work" && sumcheck ) \
            || { echo "the tree-sitter $version binary does not match its recorded hash" >&2; exit 1; }

          gunzip -c "$work/$asset" > "$cli/tree-sitter"
          chmod +x "$cli/tree-sitter"
          "$cli/tree-sitter" --version

      - name: Every .ax file parses under the checked-in grammar
        run: ./scripts/check-tree-sitter.sh

  test:
    name: Tests (${{ matrix.name }})
    needs: grammar
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: linux-aarch64
            os: ubuntu-24.04-arm
          - name: darwin-aarch64
            os: macos-14
    runs-on: ${{ matrix.os }}
    # Fifty-one of the gates below build the compiler under test from
    # `self_host/`, each producing a compiler that emits identical IR.
    # One step builds it; `gate_build_axc` reuses it while the tree's
    # source stamp matches, rebuilds when it does not, and REFUSES when
    # the path names no build product at all - so an ablation of
    # `self_host/` stays visible to every one of them and a mis-set
    # variable cannot read as a quiet success.
    # `scripts/check-gate-lib.sh` is the probe that proves that.
    env:
      AXIOM_AXC: ${{ github.workspace }}/.axiom-shared/axc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # `llc` is not on the default PATH on either runner image, and the
      # compiler shells out to it by name. `llvm-readobj` comes from the
      # same package and is what the cross-target gate uses to reject
      # non-position-independent objects.
      - uses: ./.github/actions/provision

      # Before anything that needs it. A failure here is a compiler that
      # does not build from the tree, which every gate below would
      # otherwise report one at a time and more slowly.
      - name: Build the compiler under test once
        run: ./scripts/build-shared-axc.sh "$AXIOM_AXC"

      # And immediately, the probe that the sharing above cannot hide a
      # change to `self_host/`. It plants a builder that CANNOT BUILD,
      # so "the cache was used" and "the cache was not" are the only two
      # outcomes and each is read directly rather than inferred.
      - name: The shared artifact cannot hide a source change
        run: ./scripts/check-gate-lib.sh

      # One number. The version is a bare literal in eleven places
      # across five file formats, and nothing held them to a source of
      # truth outside the compiler - `check-driver.sh` compares them to
      # what the BINARY prints, which a tree agreeing on `9.9.9` passes.
      # `VERSION` is what the tag, the archive name and the installer
      # read, so it is what the literals must match. That matters more
      # now that a tag makes those numbers something a stranger reads.
      - name: Every site states the same version
        run: ./scripts/check-version.sh

      # The other half of that one. `check-version.sh` holds every site
      # that STATES the version to `VERSION`, which is a promise about
      # an interface; this holds the binary to naming the TREE it was
      # built from, which is a fact about bytes. Without it two builds
      # of two different trees at one version are the same binary to
      # whoever holds one.
      - name: A shipped binary names the tree it was built from
        run: ./scripts/check-build-id.sh

      # These cases were also run by the deleted Rust test suite, as
      # `stdlib_golden`. This script is now their only runner, which is
      # the reason it was kept alive alongside that suite for so long.
      - name: Standard-library golden tests
        run: ./scripts/run-stdlib-tests.sh

      # `axiom test` - the runner and the assertions a stranger writes
      # their own tests with. It sits beside the goldens above rather
      # than replacing them: the goldens pin a whole program's output
      # byte for byte, which is the right shape for a fixture whose
      # subject IS what it printed, and no assertion library replaces
      # that. What this adds is the shape those goldens cannot express -
      # a failure that names itself, and a run that carries on past one.
      #
      # Its negative probe is the part worth the cycles: every
      # `assertEq` in the passing fixture is mutated in turn and each
      # mutant must exit 1 with a FAIL line. A test runner whose tests
      # cannot fail is the exact defect a test runner is for.
      - name: The test runner, its assertions and their isolation
        run: ./scripts/check-test-runner.sh

      # AX3040 is an error since 2026-08-25, and the thing that made
      # that possible is an analysis that tells a diverging function
      # from a cast. This asserts the DISTINCTION rather than the
      # diagnostic - the diagnostics corpus already pins the text, the
      # span and the severity. Its probe changes ONE WORD in the
      # accepted program and requires it to be refused, because an
      # analysis that answered "diverges" for everything would pass
      # every acceptance check and refuse nothing.
      - name: A fabricated value is refused and a diverging one is not
        run: ./scripts/check-diverging-tyvar.sh

      # The FFI boundary is a C ABI, and until this gate the only thing
      # that exercised it was a Rust crate. `check-ffi.sh` below is
      # excellent and it tests the Rust CLIENT: cargo, `#[axiom_export]`,
      # `axiom-bindgen`, the generated host binding. None of that is the
      # boundary. The boundary is `declare i64 @sym(i64, ...)` and a
      # `-l` flag, and a plain C archive bound with `cc` and `ar` was
      # measured working on the first attempt - untested, undocumented
      # for C users, and one refactor away from breaking silently.
      #
      # This runs no cargo. That is the point: the ABI keeps a test that
      # survives the Rust workspace being changed, moved or removed.
      - name: A plain C archive binds through the ABI, with no Rust
        run: ./scripts/check-c-abi.sh

      # The standard library's API reference is GENERATED, by an Axiom
      # program, and this regenerates it and diffs. It is the strongest
      # form the doc-drift rule takes: `check-doc-drift.sh` recomputes
      # the numbers a document states, and this recomputes the whole
      # document.
      #
      # It also runs the generator, which is this repository's worked
      # example of a real program - so the example is exercised by CI
      # rather than left to rot the way an example nothing depends on
      # does.
      - name: The stdlib API reference is what the library says
        run: ./scripts/check-stdlib-api.sh

      # The version number is a claim about compatibility, and this is
      # what makes it one. `check-version.sh` proves the number is
      # STATED in nineteen places; this proves it was EARNED, by
      # diffing the public surface against the baseline the last
      # release published. A removed, retyped or effect-widened public
      # name fails unless `compat/BREAKING` declares it.
      - name: The public surface agrees with the last release's baseline
        run: ./scripts/check-compat.sh

      # `axiom.pkg`: a project declares its dependencies, and two of
      # them may not provide one module. Every project this gate uses
      # is built in its work directory, and every module answers a
      # distinct number, so the EXIT STATUS says which file the
      # resolver chose - a gate that only asserted "it built" would
      # pass on the wrong module being found, which is the failure
      # this exists to catch.
      - name: A project declares what it depends on
        run: ./scripts/check-packages.sh

      # The one script a stranger pipes into bash, and nothing ran it.
      # This serves a release built from this tree over the loopback,
      # installs it, and requires three bad releases to be refused - a
      # tampered archive, one with no checksum, one with no `stdlib/`.
      # Its own probe deletes `install.sh`'s comparison in a copy and
      # requires the tampered case to stop being refused, because a
      # verification test that passes against an unverifying installer
      # is testing something else.
      - name: The installer installs, and refuses what it should
        run: ./scripts/check-install.sh

      # WHAT SHIPS AND WHAT IS SUPPORTED ARE TWO LISTS, and they live on
      # opposite sides of the project: `release.yml`'s build matrix and
      # `install.sh`'s refusal arms. Neither way of disagreeing is loud.
      # A target in both uploads an archive the installer will not
      # fetch; a target in neither hands the user a bare `curl` 404
      # where a sentence belongs. `linux-x86_64` became the first
      # supported-but-unshipped target on 2026-08-30, which is the
      # combination that makes the distinction load-bearing rather than
      # theoretical.
      - name: The release matrix and the installer's refusals agree
        run: ./scripts/check-release-targets.sh

      # The acceptance measurement for the socket work, and the only gate
      # here whose subject is MEMORY rather than an answer: a pre-forked
      # server must hold its heap flat across ten thousand connections
      # when the request handler is an arena scope. It earns a place in
      # CI despite driving twenty thousand real loopback connections
      # because it takes about four seconds - the criterion is a RATIO
      # against the same binary with the arena switched off, so it is not
      # sensitive to how fast the runner is, only to whether the
      # allocator still reclaims.
      - name: Server memory holds across ten thousand connections
        run: ./scripts/check-net.sh
      # The same question of a server that does a web server's work:
      # examples/web parses each request off the socket, renders a page
      # through the Html DSL and writes it back, and its handler must be
      # an arena scope too. Every page is compared byte for byte against
      # a response the script writes by hand, the escaped `<script>`
      # among them, and each assertion has an ablation that goes red -
      # the escaper bypassed, the path check compiled out, the arena
      # switched off. Twenty thousand rendered requests is under a
      # minute, and the memory criterion is a RATIO between two runs of
      # the same binary, so it is not sensitive to how fast the runner
      # is. This is also the only thing that runs examples/web at all.
      - name: A templated server serves its pages and holds its memory
        run: ./scripts/check-web.sh

      # A terminal put into raw mode must come back byte for byte. It
      # runs on every leg because the numbers it exercises are
      # per-target: `struct termios` is 72 bytes on Darwin and 36 on
      # Linux, `c_cc` starts at 32 there and 17 here, and ISIG is 0x80
      # against 0x1 - so this is exactly the kind of gate that passes on
      # one leg and means nothing about the other.
      #
      # IT NEEDS A PTY AND NOT A TERMINAL, which is why a CI step can run
      # it at all: it calls `openpty` and drives the pty it gets, never
      # the step's own descriptors, so having no controlling terminal is
      # not an obstacle. If it ever cannot get one it EXITS NON-ZERO
      # saying so - it is written not to skip, because a gate that goes
      # green when it could not run is counted as coverage that does not
      # exist. It needs no git history, so the default shallow checkout
      # is fine.
      - name: A raw-mode terminal is restored byte for byte
        run: ./scripts/check-terminal-restore.sh

      # Both halves on every leg: no libc on this host, and every
      # windows-x86_64 declare on the reviewed allowlist - the Windows
      # IR is emitted cross, so each leg reads it.
      - name: Freestanding check
        run: ./scripts/check-freestanding.sh

      # It runs in the matrix rather than on a single host because it
      # compiles, assembles and *runs* the output of the self-hosted
      # compiler, and both the syscall numbers and the object format are
      # platform-specific.
      #
      # This replaces a `Game of Life` step that invoked
      # `scripts/check-game-of-life.sh`. That script was removed in
      # 720a0d5 along with the sample it ran, but the step referencing it
      # was not, so every run of this job failed on a missing file - which
      # is why "CI green on all four targets" needs re-establishing rather
      # than citing.
      - name: Self-hosted compiler conformance
        run: ./scripts/check-self-host.sh

      # The compiler's command-line surface, which until this gate
      # existed was exercised by nothing: every other gate drives stage1
      # as `stage1 [FILE [TARGET]]` and runs llc and cc itself, so
      # `stage1 build` - the thing a user types - had no coverage at all.
      #
      # Its load-bearing cases are the negative ones. A driver that
      # ignores a child's exit status reports a failed `llc` as a
      # successful build while every positive test still passes, so the
      # script poisons PATH in two directions: a failing tool must fail
      # the build, and a missing `opt` must not.
      - name: Self-hosted compiler driver
        run: ./scripts/check-driver.sh

      # The differential gate, and it was not here. It exists because
      # nothing ran `tests/stdlib/` through stage1 and five miscompiles
      # were hiding in the gap - and then it ran only when somebody
      # typed its name, which is the same gap one level up. This file's
      # own risk table calls that out: a tool with no CI gate is
      # silently broken, as `fmt` was.
      #
      # It compiles every case in BOTH corpora with both compilers,
      # puts each one's IR through the identical llc/cc pipeline at
      # -O0 and -O2, and compares exit status and stdout. Holding the
      # toolchain constant is what makes it a comparison of the two
      # compilers rather than of two build pipelines.
      - name: Differential behaviour between the compilers
        run: ./scripts/check-stdlib-selfhost.sh

      # The AXDL corpus against checked-in goldens, plus the half a
      # re-bless cannot satisfy: verify-axdl-spans.py recomputes every
      # span claim from the FIXTURE'S own bytes, so a wrong column
      # blessed into a golden still fails. This was a three-way
      # differential against the Rust compiler until that compiler was
      # deleted; a differential does not fail when its reference
      # disappears, so the arm was removed rather than repointed. It
      # also fails on any diagnostic at all against the compiler's own
      # source, where a false positive would stop it compiling itself.
      - name: The AXDL corpus, and every span against the fixtures
        run: ./scripts/check-diagnostics.sh

      # `;@axiom:restrict(...)` is a claim the checker refuses when the
      # analysis it already performed contradicts it. The gate tags every
      # fn of 168 corpus programs restricted and requires identical IR,
      # AXSYM and diagnostics - except AX3051 on exactly the rows the
      # fixpoint marks incomplete - then plants five violations and
      # requires one diagnostic each, then removes the hook and requires
      # the six fixtures to stop answering. The Ada track wrote the gate
      # and not this step (2026-08-29); a gate no job runs is a script.
      - name: Restriction claims are answered, and a restricted corpus does not move
        run: ./scripts/check-restrictions.sh

      # Degenerate input answers with a diagnostic, not with a signal.
      # `axiom check` on `(fn (main) ())` was SIGSEGV - exit 139, no
      # output, nothing on stderr - and so were twenty-two other
      # positions of the same two characters, seven of them inside
      # `check`, which is what `axiom lsp` runs for every keystroke.
      #
      # No gate above could see it, and the reason is the point of this
      # one: every other suite asks what the compiler PRINTED, and a
      # process killed by a signal prints nothing, so it satisfies any
      # check written as "the output must not contain X". This one asks
      # about the process.
      - name: Degenerate input is diagnosed, not fatal
        run: ./scripts/check-degenerate.sh

      # A name the frontend accepts is a name the backend can emit.
      # `foo'`, `a+b` and `set!` are legal Axiom names - the lexer, the
      # parser, the checker, `fmt` and `symbols` all took them - and
      # codegen wrote them into LLVM unquoted, where they are not legal
      # at all, so twelve of the sixteen bytes `isIdentChar` admits
      # exited 4 with `opt` blamed for the compiler's own output.
      #
      # It is the same blind spot as the two above: all 1,629 top-level
      # names in `stdlib/` and `self_host/` are inside LLVM's set, so no
      # sweep over real code can find it. This one sweeps the RULE - all
      # 94 printable bytes, in three positions - and every probe must
      # either be refused with a span or run to 42.
      - name: Every legal name is an emittable name
        run: ./scripts/check-symbol-names.sh

      # WHICH FUNCTION DIED. Before this, a trapping program yielded a
      # status and one line, and the three SIGSEGVs the stack-depth gate
      # below records were each diagnosed only by attaching `lldb` - a
      # tool a worker dying inside a pre-forked pool does not have. The
      # answer is `"frame-pointer"="all"` on the one attribute group,
      # a table of address-beside-name over every symbol the module
      # defines, and a walker that resolves each return address at
      # `ra - 1`. Emitted text only: no `-g`, no `!dbg`, no seed move.
      #
      # The gate pins the whole trace byte for byte at `--opt 0`, checks
      # every name it prints against `nm` at every optimisation level,
      # and ablates the attribute per target to prove the check
      # discriminates. It also records, with the measurement, why the
      # roadmap's "five functions at every optimisation level" is not
      # assertable: above `--opt 0` the five frames are not lost, they
      # are never pushed.
      - name: A dying program names the frames it died in
        run: ./scripts/check-backtrace.sh

      # How much STACK the compiler needs, bisected and reported. This
      # backend eliminates only SELF tail calls and a `let` body is not a
      # tail position, so `(let ((e (vecGet v i))) (if ... e (recur ...)))`
      # - the shape most of `typecheck.ax` is written in - costs one real
      # frame per table entry. That has produced three SIGSEGVs here, each
      # presenting as a crash in whatever was being compiled rather than in
      # the walk. Nothing measured it until now; the answer is ~216 KiB
      # against an 8 MiB default, so the conversions are not urgent, and
      # this is how we find out when that stops being true.
      - name: Checking the compiler fits in a small stack
        run: ./scripts/check-stack-depth.sh

      # A module's PRIVATE declarations must cost no more to resolve
      # than its public ones. `findFnEnt` was indexed and its note
      # recorded what was left linear on purpose - the private-name
      # path - which is exactly the shape that rots unwatched. The gate
      # was written, and then run by nobody for eight days.
      - name: Private names resolve as cheaply as public ones
        run: ./scripts/check-name-scale.sh

      # A type name must mean what its own module says it means. Type
      # declarations are not rewritten to `Mod$Name` the way functions
      # are, and the lookup took the first match in a list ordered by
      # IMPORT ORDER - so two modules that each declared a `Config` had
      # one winner for the whole program and the loser's own bodies were
      # compiled against the winner's field offsets, at exit 0, with the
      # answer changing when an unrelated `(import ...)` line moved.
      #
      # The scale half of the same gate is not decoration: module-aware
      # resolution CANNOT exit on the first match, so without the index
      # that landed with it, every type reference becomes a full scan of
      # the program's types. Measured on the reverted compiler: 26.88x.
      - name: A type name resolves by module, and in constant time
        run: ./scripts/check-type-namespace.sh

      # A fault inside a recovery point must be an answer, and a fault
      # outside one must still stop the process. The three traps - out
      # of memory, an unhandled effect, a division by zero - wrote a
      # sentence to fd 2 and exited, which is the whole containment a
      # worker in a pre-forked pool had. `__axiom_recover` gives them
      # an arena mark to abort to.
      #
      # Four optimisation levels per case, and that is not thoroughness
      # for its own sake: the mechanism is a `setjmp` in inline
      # assembly whose correctness rests on what the clobber list and
      # the block's own save/restore pair say about registers, and that
      # is exactly the kind of claim that is true at -O0 and false
      # above it. Measured on a prototype with the save/restore pair
      # deleted: correct at -O0, SIGSEGV at -O1, -O2 and -O3.
      #
      # The 100,000-abort loop is paired with an ablated twin that must
      # GROW, because a flat line also reads flat when the measurement
      # is broken. Measured: 1,376 KiB against 419,328 KiB.
      - name: A trap inside a recovery point is an answer, not an exit
        run: ./scripts/check-recover.sh

      # A container that is dropped must give its elements back. Every
      # other memory gate here is reset-BASED - `measure-memory-baseline`
      # and `check-net` bracket their work in a mark and a reset - so
      # until this one existed nothing asserted the OTHER half: a
      # program that never resets, allocates containers in a loop, drops
      # them, and must not grow. That is the shape of a server, an agent
      # loop, and a compiler pass run twice.
      #
      # Every probe ships in two spellings that differ by one word, and
      # the gate asserts the two DISAGREE by more than 5x. If both go
      # flat it is red; if both grow it is red. It can only pass if
      # reclamation is happening AND the instrument can see it.
      - name: A dropped container gives its elements back
        run: ./scripts/check-container-reclaim.sh

      # And the acceptance measurement above that one: a bounded LIVE
      # SET must have bounded memory in a process that frees no
      # container and resets no arena. Three magnitudes - 20k, 200k, 2M
      # - because a plateau is what distinguishes steady state from a
      # slope, and a log-shaped leak passes any two-point ratio test.
      #
      # It earned its keep on its first run: `mapNeedsGrow` counts
      # tombstones, so a 256-entry window over 200,000 inserts grew its
      # table to ~524,288 slots and the process to 10 MB - a bounded
      # live set with unbounded memory - with every other gate in this
      # file green across it, the container gate included.
      - name: A bounded live set has bounded memory
        run: ./scripts/check-steady-state.sh

      # And the cost this repository carried on every fallible call
      # until 2026-08-25: the block a call returning `Result` answers
      # was reclaimed under no spelling - 32 bytes a call, linear in
      # the thing an error model exists to make ordinary
      # (docs/error-model.md ERR-MEM-4). `370-error-propagation.ax`
      # term 32 asserts it is reclaimed now, and this gate asserts
      # that the compiler is WHY: it turns off the one word the fix
      # turns on, rebuilds, and requires the fixture to go red at term
      # 32 and at no other term. A flat line that no ablation can bend
      # is not evidence of reclamation.
      - name: A fallible call's block is reclaimed, and one word is what does it
        run: ./scripts/check-fallible-reclaim.sh

      # The same argument for the application through a CLOSURE, which
      # gave back nothing at all where a direct call has given back its
      # owned temporaries since MM-LIFE-2g. A two-argument handler is a
      # curried chain, and the record its first step answers was simply
      # dropped - 32 bytes an application, which `stdlib/Fallible.ax`
      # had written down as a REASON ITS OPERATION TAKES ONE ARGUMENT.
      # A language decision resting on a compiler defect.
      # `460-closure-reclaim.ax`'s byte terms assert it is given back;
      # this gate asserts the compiler is why, by ablating the one word
      # in each of the two walkers and requiring the fixture to go red
      # at the byte terms and green at the two that check the chains
      # still ANSWER correctly - so an ablation that broke the program
      # instead of restoring the leak reads differently from one that
      # did not.
      - name: A closure chain's intermediate record is reclaimed, and one word in each walker is what does it
        run: ./scripts/check-closure-reclaim.sh

      # And the release traffic that could not free anything. Measured
      # 2026-08-31 over the compiler's own emitted IR (`emit-llvm
      # self_host/main.ax`, 197,562 lines, 3,469 functions), by
      # classifying every release site by what DEFINES the value it
      # releases: 5,762 of 10,849 - 53.1% - were static string
      # literals. A bare literal is the address of a `@strhdr_*`
      # constant whose count word is the sentinel -1, so
      # `@axiom_release` loads a count, compares it against -1, and
      # returns. Over half the release traffic in the largest Axiom
      # program there is, doing nothing, and the operand's definition
      # said so at compile time. 5762 -> 5 now, the residue from
      # release paths that hold no AST node to ask; 10,849 -> 5,117
      # sites in total, with emitted output byte-identical.
      #
      # The obvious fix - `valueOwnedRef` answering 0 for `TAG_E_STR` -
      # is the wrong one, and assertion 2 is what keeps that honest.
      # That predicate answers 1 on purpose, so `(if c "lit" (mkStr))`
      # stays owned and the OTHER branch's share is still given back;
      # answering 0 silences this release and LEAKS that one. So
      # `isStaticSentinelNode` is asked at the two sites that emit a
      # release for a value that IS the literal - argument position and
      # the block-construction field store - and the join reasoning is
      # untouched. The ablation turns the predicate's answer off,
      # rebuilds the compiler from the ablated tree and requires the
      # count back in the thousands: a count no ablation can move is
      # not evidence.
      - name: A release on a static string literal is not emitted, and one predicate is what does it
        run: ./scripts/check-static-release.sh

      # The effect fixpoint's worklist. One round of two passes in
      # opposite directions collapses a linear chain in either
      # declaration order, which is why the two orders a human writes
      # are both fast; it does not collapse the order a GENERATOR
      # produces - a helper emitted beside each of its callers - where
      # each round advanced the frontier by one pair and paid for a
      # full walk of every body. 56s at n=8000, against 0.09s for the
      # same call graph declared in order. This asserts a RATIO, so a
      # slow runner cannot fail it, and then ablates the one line that
      # chooses the frontier and requires the ratio to come back: an
      # assertion that passes with the feature removed is testing
      # nothing. It also requires `symbols --calls` to be byte-identical
      # across that ablation, because a wrong frontier shows up as one
      # missing effect in 3,496 rows rather than as a crash.
      - name: The effect fixpoint is a worklist, and the frontier is what makes it one
        run: ./scripts/check-effect-fixpoint.sh

      # `#effects-incomplete` says a row is a LOWER bound, and a claim of
      # absence over one cannot be answered - AX3037, AX3038, AX3051, all
      # warnings rather than verdicts. The mark used to fire on the
      # ARGUMENT's shape, so `(cmp (memGetWord d r) (memGetWord d k))`
      # made `vecSortBy` a lower bound on the strength of two machine
      # words its own signature calls integers. It fires on the CALLEE'S
      # DECLARED POSITION now. Four controls must KEEP the mark - a type
      # variable, an arrow position, a mixed callee, a head that is not a
      # name - because deleting the mark outright would otherwise pass,
      # and the ablation drops the type test and requires the two
      # complete rows to go back to lower bounds.
      - name: An unfollowed argument is a hole only where the signature says it could be one
        run: ./scripts/check-effect-argpos.sh

      # The emitted runtime's eight mutable globals and the one
      # predicate that decides their storage class. Under `fork`,
      # MM-PAR-3 gets memory safety for free - every process-wide
      # mutable global is private after the fork. Under threads it is
      # BOUGHT, by making the identical set thread-local, and the set is
      # an enumeration rather than a sentence. The half worth more is
      # the one that does nothing: a program that spawns no thread must
      # be byte-identical, because on Darwin a thread-local access is an
      # indirect call through libSystem's `__tlv_bootstrap` and would
      # take every program in the tree out of MM-FFI-1's tier 1. And
      # local-exec is mandatory rather than preferred - the default
      # model needs a dynamic resolver, which check-freestanding
      # refuses - so the gate requires the resolver absent AND requires
      # it to appear when `(localexec)` is dropped, on both Linux
      # targets, whose markers differ: x86-64 calls `__tls_get_addr`,
      # AArch64 uses TLS descriptors and never names it.
      - name: The runtime's mutable globals move under the thread flag, and nothing else does
        run: ./scripts/check-thread-local.sh

      # And what a reset COSTS, which is the roadmap's P8 and the one
      # thing no gate here measured: every timing gate asserts a ratio,
      # deliberately, so a slow runner cannot fail it - which left rate
      # uncovered. This makes the rate a ratio anyway, by running one
      # program in three spellings a word apart. Its negative probe
      # deletes the scrub from the EMITTED IR and rebuilds, so the two
      # binaries differ in the scrub and nothing else.
      #
      # About five seconds: three builds and twenty short runs.
      - name: What an arena reset costs, and that the scrub is what costs it
        run: ./scripts/check-arena-reset-rate.sh

      # Two `axiom run`s in one directory must not corrupt each other.
      # The scratch name was a fixed literal in the working directory,
      # so concurrent runs overwrote each other's intermediates - and
      # the failure was not a crash but a WRONG ANSWER: one program
      # returning another's result, exit 0, nothing on stderr.
      #
      # No other gate could see it, because every other gate runs one
      # compiler at a time or gives each case its own directory. This is
      # also the prerequisite for any parallel work: no job pool can be
      # trusted while a filename is shared.
      - name: Concurrent runs in one directory do not collide
        run: ./scripts/check-concurrent-run.sh

      # `fmt` is the tool that had no gate, and it had six independent
      # ways of silently destroying a source file. This formats a copy of
      # the whole repository and re-runs the suites against it, so a
      # formatter change that alters what a program means fails here.
      - name: Formatter round-trip
        run: ./scripts/check-fmt.sh

      # The formatter, pinned without a second compiler. This was a
      # differential against the Rust `fmt` until that compiler was
      # deleted - and a differential does not FAIL when its reference
      # disappears, it passes by comparing a compiler with itself. So
      # the reference is now a checked-in corpus golden keyed by source
      # hash, plus the idempotence and preservation properties and the
      # `tests/fmt/parity/*.axp` refusal bank.
      - name: Formatter goldens, idempotence and refusals
        run: ./scripts/check-fmt-selfhost.sh

      # `explain` and `symbols`, pinned without a second compiler: every
      # code the corpus emits must be one `explain --list` lists, and
      # every `.ax` file's AXSYM output is compared against a checked-in
      # golden with its exit status, accepted and refused files counted
      # live rather than against a hard-coded number.
      - name: explain and symbols against their goldens
        run: ./scripts/check-tools-selfhost.sh

      # The standard library performs exactly the effects it declares,
      # and the set of declarations performing any is the one on file.
      # `docs/agent-harness.md` §3.4's Agent.Policy, and a GATE rather
      # than a compiler mode for the reason that document gives: the
      # only boundary policy that has ever worked here is `check-ffi.sh`
      # comparing a binary's symbols against a checked-in manifest with
      # a negative probe, and this is that shape over the AXSYM stream.
      # It found two stdlib functions performing I/O without claiming it
      # on its first run.
      - name: The standard library declares what it performs
        run: ./scripts/check-agent-policy.sh

      # The other half of the same walk. `inferEffects` resolves a call
      # edge for every effect it attributes and used to drop it, so a
      # row could say `#effects=IO` and not which call put it there.
      # `symbols --calls` prints the edge; this asserts the graph and
      # the effect rows are two views of one walk - no callee effect
      # escapes its caller, every inferred effect has an edge, and every
      # IO reaches a syscall or an extern. Opt-in, so the symbols golden
      # does not move.
      - name: The call graph explains the effect rows
        run: ./scripts/check-agent-calls.sh

      # Syscall numbers are written down TWICE in this repository - once
      # in `self_host/codegen.ax` for the runtime the compiler emits
      # (the allocator's mmap, and the exit and write of three abort
      # paths), once in `stdlib/Sys/Platform.*.ax` for the standard
      # library - and nothing compared them. They had already
      # disagreed: the emitted abort paths exited through Linux `exit`
      # (93/60) while the platform modules use `exit_group` (94/231),
      # and `Platform.linux-aarch64.ax` said "exit_group (94), not exit
      # (93)" while the compiler emitted 93. Latent only until one of
      # these programs has a second thread, at which point the abort
      # ends a thread and the process stays alive.
      #
      # It runs in the matrix like its neighbours but is not really a
      # per-runner check - it reads all seven targets from whichever
      # host it is on, out of `emit-llvm` rather than out of the
      # sources, so darwin-x86_64 (which has no runner anywhere in this
      # file) and freebsd-aarch64 (executed by no runner either) are
      # covered three times over rather than never. freebsd-x86_64 and
      # windows-x86_64 no longer belong on that list: since 2026-08-30
      # both have blocking legs that EXECUTE what the compiler emits,
      # which is what took them off it. About eight seconds, almost all of it building the
      # compiler under test, which it must: the codegen table is half of
      # what it compares.
      - name: The two tables of syscall numbers agree
        run: ./scripts/check-platform-constants.sh

      # The Windows entry shim's command-line and environment parsers,
      # cut out of the emitted Windows IR and executed HERE, on the
      # host, against known answers - the one part of a Windows binary
      # this matrix can run before a Windows leg exists, and the part
      # whose wrong answers look plausible rather than crash.
      - name: The Windows entry shim's parsers answer on this host
        run: ./scripts/check-windows-entry.sh

      # The native human and JSON diagnostic renderers, pinned without a
      # second compiler: checked-in goldens, cross-checked against the
      # AXDL goldens, exit statuses DERIVED from the golden's own
      # severity column, every quoted source row checked against the
      # fixture, and the escape stream checked against the palette
      # `self_host/style.ax` declares. Never a byte comparison with the
      # Rust compiler's human output: that output was the `ariadne`
      # crate's, an internal of a compiler that has been deleted.
      - name: Human and JSON diagnostic renderers
        run: ./scripts/check-render-selfhost.sh

      # The REPL, pinned without a second compiler: piped session by
      # piped session against checked-in goldens, byte-exact for every
      # deterministic surface and marker-pinned in shape for the ones
      # that carry a time or an address (:time/:llvm/:defs), with
      # stderr required empty and the exit code pinned.
      - name: REPL sessions against their goldens
        run: ./scripts/check-repl-selfhost.sh

      # The language server. The first tool surface that is NOT a port
      # of a stage0 tool - there is no `axiom lsp` in the Rust compiler
      # - so it cannot be a two-sided differential and is the
      # native-surface shape instead: a checked-in golden for the
      # framed session bytes, PLUS every published diagnostic checked
      # against what stage0's own AXDL reports for the same file,
      # including the column, converted from stage0's 1-based character
      # index into LSP's 0-based UTF-16 code unit. The conversion is
      # what the negative test ablates, and a version of this gate that
      # compared only line numbers passed with it removed.
      - name: Language server
        run: ./scripts/check-lsp-selfhost.sh

      # The normative documents drift because they are maintained by
      # hand: nine claims in README.md and docs/reference.md were
      # measurably false on 2026-08-10, including a benchmark ratio this
      # repository had already corrected in another file and "No LSP
      # yet" forty lines below the row listing the LSP. Correcting them
      # by hand is a treadmill - seven stale file counts have been fixed
      # one at a time across this project's history - so every count is
      # recomputed, every **Complete** row must name a fixture that
      # exists, and the diagnostic registry is compared BOTH ways
      # (a code constructed but never reached by a corpus fixture
      # escapes the emitted->listed check that already existed).
      - name: Documentation agrees with the tree
        run: ./scripts/check-doc-drift.sh

      # The frontend has five consumers - check, symbols, fmt, the
      # REPL's :load and the language server - each reaching
      # parseModuleWith/resolveImports/checkModule through its own call
      # site, and until this gate nothing compared them. Three of the
      # four defects it is seeded with exist because a NEW consumer
      # re-derived a rule the frontend already had. It asserts the
      # VALUE as well as the verdict, which is the assertion none of
      # the other gates can make: every one of those defects passed
      # `check` at exit 0 and differed only in what the program then
      # computed.
      - name: Frontend parity across its five consumers
        run: ./scripts/check-frontend-parity.sh

      # The P2 memory-model exit criterion: one Life board advanced
      # 2000 generations stays under 4 MiB when the loop carries the
      # explicit mark/copy/reset contract, grows linearly when it
      # does not, and CORRUPTS when the reset drops its copy - all
      # three measured, the third proving the gate can see the
      # unsoundness class. Automation of the contract is a future
      # slice, gated on static pointerhood (Int is the universal
      # handle type; String unifies with Int by fiat).
      - name: Memory baseline (managed flat, unmanaged linear)
        run: ./scripts/check-memory-baseline.sh

  # `rust/` is a cargo workspace with five crates, a trybuild suite and
  # a bindgen snapshot suite, and `scripts/check-ffi.sh` is the gate
  # `docs/memory-model.md` MM-FFI-5 requires - the one that enumerates
  # the external symbols the FFI opens rather than forbidding all of
  # them. None of it ran here: `tests/ffi/` (40 fixtures) was read by
  # exactly one script, and that script was read by nothing. Which is
  # the same gap this file's own risk note names - a tool with no CI
  # gate is silently broken, as `fmt` was.
  ffi:
    name: FFI (${{ matrix.name }})
    needs: grammar
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: darwin-aarch64
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # `toolchain: stable` is spelled out because the ref no longer
      # says it. This action's only branches ARE toolchain names -
      # `@stable` selected the toolchain and the code in one ref - and
      # `stable` is force-pushed on every Rust release, so pinning the
      # SHA freezes six-monthly-moving action code at a reviewed commit.
      # The input defaults to `stable` at this SHA and the action reads
      # `inputs.toolchain` alone, never `github.action_ref`, so the pin
      # does not change which Rust gets installed - but naming it keeps
      # that true if the default ever changes, and tells the next reader
      # what the hex was for.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
        with:
          toolchain: stable
      - uses: ./.github/actions/provision

      # The three tiers the gate prices, the generated binding diffed
      # against the checked-in one, the allowlist with its negative
      # probes, and a Rust binary calling into an Axiom archive.
      - name: The FFI opens exactly the door it declares
        run: ./scripts/check-ffi.sh

      # The crates' own suites: the classifier's unit tests, the
      # 21-case trybuild bank of rejected `#[axiom_export]` shapes, and
      # the bindgen snapshots. `axiom-host` is excluded because it
      # links an Axiom archive that check-ffi.sh builds, not cargo.
      - name: The FFI crates' own tests
        run: cd rust && cargo test --workspace --exclude axiom-host

  # ---------------------------------------------------------------
  # FreeBSD, EXECUTED - and SUPPORTED since 2026-08-30. Every other job
  # that meets the two FreeBSD targets assembles their IR and compares
  # bytes; only this one runs it. (The sentence here used to send a
  # reader to `release.yml` "in its own words" for why assembling is
  # not support. That file has never mentioned FreeBSD - `grep -ci
  # freebsd release.yml` answers 0 - so the citation was dangling from
  # the day it was written. The rule it meant is README's *Targets*
  # section, which is where it now points.) This
  # job boots a real FreeBSD 14 kernel in a VM on the Ubuntu runner
  # (KVM-accelerated - the hosted runners expose /dev/kvm) and runs
  # what the compiler emits there: the bootstrap from the committed
  # `bootstrap/axiom-freebsd-x86_64.ll` to the fixpoint, then the gates
  # that hold `stdlib/Sys/Platform.freebsd.ax`'s 82 numbers and two
  # struct layouts to the kernel that owns them. `check-net.sh` is the
  # one that matters most: it opens a real listener on `::1`, which is
  # what falsifies `afInet6` = 28 and the 64-byte `struct kevent`
  # stride, and no amount of assembling can.
  #
  # SUPPORTED, AND THIS JOB IS WHAT MAKES THAT TRUE. `continue-on-error`
  # was removed on 2026-08-30 after the leg had been seen green on 13
  # of the previous 15 runs with no failures - the rule being that the
  # line comes off AFTER the evidence, not in the commit that adds the
  # job, which cannot have seen anything. It can fail the workflow now,
  # which is the whole content of the word.
  #
  # freebsd-x86_64 is SUPPORTED and UNSHIPPED: no release archive is
  # built for it, and `install.sh` gives a FreeBSD x86_64 host the
  # build-from-source paragraph that `linux-x86_64` gets rather than
  # the not-supported one `darwin-x86_64` gets. freebsd-AARCH64 is
  # unchanged and still unsupported - it has no leg, for the TCG
  # reason recorded below.
  #
  # PINNING, AND WHAT IT DOES NOT PIN. The action is pinned to a commit
  # SHA like every other action in this file, which pins the
  # JavaScript that boots the VM. It does not pin the disk image:
  # vmactions builds its images from the official FreeBSD release VM
  # images and the action fetches them from its own releases at run
  # time, with `release: "14.4"` naming which. That is one step less
  # than the tree-sitter binary above, which is checked against a
  # recorded hash, and it is stated here rather than left implicit:
  # what runs in this job is FreeBSD 14.4 as vmactions packaged it, and
  # a compromise of that packaging would reach this job. What the job
  # can reach is bounded the way every job here is - `permissions:
  # contents: read`, no secret, no upload, no push.
  #
  # `prepare` and `run` execute under sh inside the VM (the action
  # ignores `usesh` now). The gates are bash, and `llc`/`llvm-readobj`
  # come from the LLVM package under `/usr/local/llvm*/bin`; `cc` is
  # the base system's clang, `nm` its ELF Tool Chain one (no `-j`, so
  # `check-backtrace.sh` falls back to the base `llvm-nm`), and
  # `check-net.sh` drives its connections with python3. Nothing else
  # from ports.
  # ---------------------------------------------------------------
  test-freebsd:
    name: Tests (freebsd-x86_64)
    needs: grammar
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Bootstrap from the seed and run the gates on FreeBSD 14
        uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1 # v1.5.5
        with:
          release: "14.4"
          copyback: false
          prepare: |
            pkg install -y bash llvm python3
          run: |
            set -e
            export PATH="$(ls -d /usr/local/llvm*/bin | sort -V | tail -1):$PATH"
            uname -a; llc --version | head -2; cc --version | head -1
            ./scripts/bootstrap-from-seed.sh --install .axiom-bin
            ./scripts/run-stdlib-tests.sh
            ./scripts/check-freestanding.sh
            ./scripts/check-net.sh
            ./scripts/check-platform-constants.sh
            ./scripts/check-recover.sh
            ./scripts/check-backtrace.sh

  # There is no freebsd-aarch64 job. The action's own documentation
  # says the host for an `arch: aarch64` guest is still the x86_64
  # runner and that `ubuntu-24.04-arm` is slower, so the guest would be
  # TCG-emulated either way - the 10-30x case, a 300-minute budget for
  # a bootstrap plus four gates, measured 2026-08-29 and dropped the
  # same day. freebsd-aarch64 ships as darwin-x86_64 does: assembled
  # and relocation-checked by `cross` below, executed by no runner.
  # Where it HAS executed is a FreeBSD 14.4 arm64 VM under HVF on the
  # maintainer's machine, 2026-08-29 - a measurement, not a leg.

  cross:
    name: Cross-target codegen
    needs: grammar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/provision

      # Every target's IR must at least assemble from a single host: the
      # standard library picks syscall numbers by target, and a typo in a
      # platform module is otherwise invisible until someone builds on
      # that platform.

      - name: Assemble every target from one host
        run: ./scripts/check-cross-targets.sh

      # The Windows hello, emitted here where the tree's compiler runs
      # and handed to the `windows` job below, which cannot build the
      # compiler (no seed, no hosting yet) but can assemble, link and
      # RUN what this one emits. The golden and the allowlist travel
      # with the modules, so the run compares against this commit's.
      - name: Emit the Windows hello for the windows job
        run: ./scripts/check-windows-hello.sh --emit windows-hello
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-hello
          path: windows-hello
          if-no-files-found: error
          retention-days: 3

  # ---------------------------------------------------------------
  # The Windows leg, and windows-x86_64 is SUPPORTED since 2026-08-30:
  # README's Targets section defines a supported target as one whose CI
  # leg executes what the compiler emits there, this job is that leg,
  # and `continue-on-error` came off after it had been seen green on 13
  # of the previous 15 runs with no failures.
  #
  # WHAT THIS LEG COVERS, AND WHAT IT DOES NOT, because "supported"
  # must not quietly mean two different amounts. The FreeBSD leg boots
  # a real kernel, bootstraps from the seed and runs the whole stdlib
  # corpus plus five gates. THIS ONE RUNS ONE PROGRAM: hello.exe,
  # executed against `tests/stdlib/010-hello.out`, with its imports
  # held to an allowlist and a leaky probe proving the allowlist
  # refuses. That is a real execution and it is what the definition
  # asks for, but it is one program - so a Windows-only miscompile in
  # any stdlib module this hello does not touch would not be caught
  # here. Widening it means linking and running the corpus the `cross`
  # job already assembles for windows-x86_64, and until that happens
  # this paragraph is the honest scope of the word.
  #
  # SUPPORTED AS A TARGET IS NOT SUPPORTED AS A HOST. The compiler does
  # not run on Windows - there is no Windows seed in `bootstrap/` and
  # `install.sh` refuses a Windows host outright. What is supported is
  # the binary this compiler EMITS for windows-x86_64.
  #
  # It cross-builds nothing - there is no Windows seed
  # and the compiler does not host on Windows yet - so it takes the
  # modules the `cross` job emitted on Linux, assembles them with
  # `llc`, links them with `lld-link` against import libraries
  # `llvm-dlltool` generates (no SDK), holds the imports to
  # `scripts/platform-allow.windows.txt`, and EXECUTES hello.exe
  # against `tests/stdlib/010-hello.out`. `.gitattributes` keeps the
  # golden's bytes LF on checkout.
  #
  # LLVM comes from chocolatey rather than the image's preinstalled
  # copy, because which LLVM the image ships changes under the job and
  # the log should name the one that ran; `llc --version` prints it.
  # ---------------------------------------------------------------
  windows:
    name: Tests (windows-x86_64)
    needs: cross
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The Chocolatey `llvm` package is the official Windows release,
      # which ships clang and lld but NOT `llc` - measured 2026-08-29 on
      # this leg's first run: LLVM 20.1.8 "already installed", then
      # `llc: command not found`. MSYS2's mingw-w64 LLVM ships every tool
      # under one bin/, and the runner image carries MSYS2 at C:\msys64.
      - name: Install LLVM (llc, lld-link, llvm-dlltool, llvm-readobj)
        run: |
          C:/msys64/usr/bin/pacman.exe -S --noconfirm --needed mingw-w64-x86_64-llvm mingw-w64-x86_64-lld
          echo "C:\\msys64\\mingw64\\bin" >> "$GITHUB_PATH"
      - name: The toolchain that ran
        run: llc --version && lld-link --version && command -v llvm-dlltool llvm-readobj
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-hello
          path: windows-hello
      - name: A hello world links, imports only kernel32's permitted names, and runs
        run: ./scripts/check-windows-hello.sh --run windows-hello

  bootstrap:
    name: Self-hosting fixpoint
    needs: grammar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/provision

      # `stage2 == stage3` is the criterion the whole self-hosting effort
      # is aimed at, and the script that checks it was in the tree but
      # wired into nothing - so a regression in it would have been found
      # by whoever next ran it by hand.

      - name: stage2 and stage3 are byte-identical
        run: ./scripts/check-bootstrap.sh

  # The other half of the seed's story, and the half nothing checked
  # until 2026-08-25. `bootstrap` above proves the seed can BUILD this
  # source. This proves the seed IS the output of source in this
  # repository's history, by regenerating all six files from the
  # commit that last wrote the six `.ll` files and requiring byte-identity.
  #
  # ITS OWN JOB, for two reasons that are both about the checkout. It
  # needs `fetch-depth: 0`: the default shallow clone has one commit,
  # and `git log -- bootstrap/*.ll` on it cannot find the commit that wrote
  # a directory it never fetched - the gate would report "no commit
  # touches bootstrap/" rather than a wrong answer, but it would report
  # it on every run. And it costs a compiler build plus six
  # whole-compiler emissions, about seven minutes, which is a poor
  # neighbour for the `test` job's fifty-one steps.
  seed-provenance:
    name: The seed is its source's emission
    needs: grammar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/provision

      - name: Regenerate all six seeds from the source they came from
        run: ./scripts/check-seed-provenance.sh

  # The seed's ANCESTRY. `seed-provenance` proves the seed is its own
  # tree's emission; this proves the compiler that emitted it is on a
  # chain that begins outside Axiom - the rows of `bootstrap/CHAIN` that
  # `bootstrap/CHAIN.checkpoint` does not certify, replayed, and never
  # fewer than the newest: the previous seed built with `llc` and `cc`
  # compiles the tree of the seed in the tree and must reproduce it.
  # `scripts/check-seed-lineage.sh` reads the whole table's structure
  # every time it runs, and RECOMPUTES the checkpoint's digest from
  # `bootstrap/CHAIN` before it skips a single row - a covered row that
  # moved voids the checkpoint, and the gate then replays every row from
  # the Rust anchor and goes red. So this job cannot be made cheap by
  # editing the table it checks; it can only be made expensive.
  #
  # `fetch-depth: 0` for the reason the two jobs above it need it: the
  # gate walks the history for every commit that ever wrote
  # `bootstrap/*.ll`, and a shallow clone has none of them. It refuses
  # by name rather than passing when it finds none.
  #
  # Only when the push or pull request touched `bootstrap/`. A
  # workflow-level `paths:` filter would gate every job here, and a
  # third-party changed-files action is a supply-chain decision this
  # file does not make lightly, so the step asks git: the diff against
  # the pull request's base, or against the push's `before`. When
  # neither is answerable (a new branch's first push) it runs, which
  # is the safe direction. The skip is printed by name.
  seed-lineage:
    name: The seed reproduces from the seed before it
    needs: grammar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Did this change touch bootstrap/?
        id: touched
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then
            range="origin/$BASE_REF...HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            range="$BEFORE..HEAD"
          else
            echo "no base to diff against; replaying"
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$range" -- bootstrap/ | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip: $range touches nothing under bootstrap/; the newest link was replayed when it landed"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/provision
        if: steps.touched.outputs.run == 'true'
      - name: The uncertified rows of bootstrap/CHAIN replay
        if: steps.touched.outputs.run == 'true'
        run: ./scripts/check-seed-lineage.sh

  # Every row, from the Rust anchor: cargo builds the compiler at
  # `bb730db`, it reproduces the first seed, and each seed after that
  # is reproduced from the one before - thirteen links and a
  # sixty-three-commit walk. Nightly, and on the button; `grammar` is
  # skipped on both triggers so nothing else runs.
  #
  # This job does NOT bless `bootstrap/CHAIN.checkpoint`, and the
  # workflow holds `contents: read` so it could not commit one. A gate
  # that advances its own trust anchor whenever it passes proves
  # nothing, and a nightly that did it would advance it unwatched. The
  # checkpoint is advanced by a person, with `AXIOM_BLESS=1
  # scripts/check-seed-lineage.sh --full`, in the diff that a reviewer
  # reads. What this job is for is the other direction: it re-derives
  # every row from `bb730db` daily whatever the checkpoint says, so a
  # prefix that was certified wrongly has a day to live.
  # `dtolnay/rust-toolchain` is pinned to the same SHA the `ffi` job
  # pins, for the reason stated above it.
  seed-lineage-full:
    name: The seed lineage replays from the Rust anchor
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
        with:
          toolchain: stable
      - uses: ./.github/actions/provision
      - name: Every row of bootstrap/CHAIN replays, and the anchor's probes go red
        run: ./scripts/check-seed-lineage.sh --full

  reproducible:
    name: Reproducible build
    needs: grammar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/provision

      - name: Byte-identical output from two independent runs
        run: ./scripts/check-reproducible.sh

  # ---------------------------------------------------------------
  # The load-bearing job. Every other one here PROVISIONS a compiler
  # from `bootstrap/` and gets on with testing something; this one
  # tests the provisioning itself, end to end, as the thing under test:
  # seed -> stage1 -> stage2 -> stage3, byte-identical at the top, and
  # a program compiled and run by the result.
  #
  # If it is green, a clean checkout of this repository produces a
  # working Axiom compiler with nothing but `llc` and a C linker. That
  # was the precondition for deleting the Rust crates, and it is now
  # the precondition for the repository being buildable at all.
  #
  # It is also what fails when the committed seed goes stale - when
  # self_host/ starts using something the seed cannot compile - and
  # `scripts/reseed.sh` is the fix. Run on both architectures because
  # the seed is per-target and a wrong syscall table in one of them is
  # invisible from the other.
  # ---------------------------------------------------------------
  bootstrap-no-rust:
    name: Bootstrap from seed (${{ matrix.name }})
    needs: grammar
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: darwin-aarch64
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Not `./.github/actions/provision`: that action ends by INSTALLING
      # the result, and what this job tests is the build itself, on the
      # two architectures where nothing else builds a seed from scratch.
      - name: Install LLVM tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang
          echo "$(llvm-config --bindir)" >> "$GITHUB_PATH"
      - name: Install LLVM tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
      - name: Build the compiler from the committed seed
        run: ./scripts/bootstrap-from-seed.sh

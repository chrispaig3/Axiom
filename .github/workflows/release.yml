# Cut a release when a `v*` tag is pushed.
#
# `ci.yml` runs on every pull request with `permissions: contents: read`
# and never pushes, uploads or reads a secret. Releasing lives here, with
# its own narrower trigger, so only this file needs write access.
#
# The tag is not trusted. A binary whose `--version` disagrees with its
# archive must never ship, so the first job checks that the tag,
# `VERSION` and the built compiler agree before anything is uploaded.
# It runs `scripts/check-version.sh`, the same gate CI runs.
#
# Two targets are built and attached: `linux-aarch64` and
# `darwin-aarch64`, the two README calls supported. The other targets
# are source-only: no CI leg runs the test battery on them, so an archive
# for one would hold a binary the battery never saw.
#
# Supported means a CI leg executes what the compiler emits there.
# Shipped means a release carries a prebuilt archive.
# `scripts/install.sh` refuses every unshipped target with a message to
# build from source. `scripts/check-release-targets.sh` keeps this
# matrix, that refusal list and README's Supported and Source-only lines
# in step.
#
# The seed remains the supported way to build from source on any host.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # Nothing builds until the number agrees with itself.
  verify:
    name: The tag, VERSION and the binary agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/provision

      - name: The tag matches VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          want="$(tr -d '[:space:]' < VERSION)"
          if [[ "$tag" != "$want" ]]; then
            echo "FAIL: tag is 'v$tag' but VERSION says '$want'."
            echo "      A release whose tag and contents disagree is the one"
            echo "      thing this workflow exists to prevent."
            exit 1
          fi
          echo "ok   tag v$tag == VERSION $want"

      # Every site, plus the compiler that actually gets built.
      - name: Every site states it, including the built compiler
        run: ./scripts/check-version.sh

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          # linux-x86_64 is source-only. Adding it needs a CI leg that
          # supports it and its removal from `install.sh`'s refusal list,
          # or `scripts/check-release-targets.sh` fails.
          - name: linux-aarch64
            os: ubuntu-24.04-arm
          - name: darwin-aarch64
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/provision

      # Build from the committed seed, the path a consumer takes:
      # seed -> stage1 -> stage2 -> stage3. Stage2 and stage3 must be
      # byte-identical, and stage3 builds the shipped binary below.
      - name: Bootstrap from the committed seed
        run: ./scripts/bootstrap-from-seed.sh --install "$RUNNER_TEMP/out"

      # A fixpoint compiler's source holds no build-time value, so
      # `stage3` reports `(build unstamped)`. Such a binary cannot be told
      # apart from any other build at its version
      # (`scripts/check-build-id.sh`).
      #
      # So `stage3` builds one more compiler, from a `self_host/` that
      # differs from the fixpoint's input in one string literal. The
      # fixpoint check has already passed. What ships is the fixpoint
      # compiler's output over source a reader can regenerate:
      # `scripts/build-stamped.sh` prints the id and checks that the
      # binary reports it.
      - name: Stamp the shipped binary with the tree it came from
        run: |
          AXIOM="$RUNNER_TEMP/out/axiom" ./scripts/build-stamped.sh "$RUNNER_TEMP/out/axiom-stamped"
          mv "$RUNNER_TEMP/out/axiom-stamped" "$RUNNER_TEMP/out/axiom"

      - name: The shipped binary reports the release version and its build
        run: |
          got="$("$RUNNER_TEMP/out/axiom" version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          want="$(tr -d '[:space:]' < VERSION)"
          [[ "$got" == "$want" ]] || { echo "FAIL: binary says $got, VERSION says $want"; exit 1; }
          # And it must not ship saying it does not know what it is.
          line="$("$RUNNER_TEMP/out/axiom" version)"
          case "$line" in
            *"(build unstamped)"*)
              echo "FAIL: the archive would ship an unstamped binary: $line"; exit 1 ;;
            *"(build "*) ;;
            *) echo "FAIL: the binary reports no build id at all: $line"; exit 1 ;;
          esac
          echo "ok   $line"

      # The stdlib travels with the compiler. `axiom` resolves modules
      # relative to its own location, so an archive holding only the
      # binary produces "cannot resolve import IO" on first use.
      - name: Assemble the archive
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          d="axiom-$v-${{ matrix.name }}"
          mkdir -p "$d/bin"
          cp "$RUNNER_TEMP/out/axiom" "$d/bin/axiom"
          cp -R stdlib "$d/stdlib"
          cp LICENSE README.md CHANGELOG.md "$d/"
          # `docs/` ships too: the README links into it, and an installed
          # user needs the reference those links point at.
          cp -R docs "$d/docs"
          tar -czf "$d.tar.gz" "$d"
          # `sha256sum` on the Linux images, `shasum` on macOS.
          # `scripts/install.sh` picks between the same two tools, so it
          # can read the file written here.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$d.tar.gz" > "$d.tar.gz.sha256"
          else
            shasum -a 256 "$d.tar.gz" > "$d.tar.gz.sha256"
          fi
          cat "$d.tar.gz.sha256"
          echo "ARCHIVE=$d.tar.gz" >> "$GITHUB_ENV"

      # A tarball whose compiler cannot compile is worse than none, the
      # same rule `bootstrap-from-seed.sh` applies to its own output.
      #
      # The probe imports a module, so an archive without `stdlib/`
      # fails it. It runs from a directory with no `stdlib/`, because the
      # compiler's last-resort search is a working-directory `stdlib/`
      # and the checkout has one. It calls the compiler by bare name on
      # PATH, as `scripts/install.sh` tells users to: the absolute-path
      # form finds the stdlib even where the PATH form cannot.
      - name: The archive works when unpacked somewhere else
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          d="axiom-$v-${{ matrix.name }}"
          mkdir -p "$RUNNER_TEMP/unpack" && tar -xzf "$d.tar.gz" -C "$RUNNER_TEMP/unpack"
          test -d "$RUNNER_TEMP/unpack/$d/stdlib" \
            || { echo "FAIL: the archive holds no stdlib/"; exit 1; }
          mkdir -p "$RUNNER_TEMP/probe"
          printf '%s\n' \
            '(import IO (writeStr))' \
            '' \
            '(:: main Int)' \
            '' \
            ';@axiom:effect(io)' \
            '(fn (main)' \
            '  {' \
            '    (writeStr 1 "the standard library travelled with the compiler\n")' \
            '    42' \
            '  }' \
            ')' > "$RUNNER_TEMP/probe/probe.ax"
          cd "$RUNNER_TEMP/probe"
          test ! -e stdlib || { echo "FAIL: the probe directory has a stdlib/ of its own"; exit 1; }
          unset AXIOM_STDLIB AXIOM_PATH
          PATH="$RUNNER_TEMP/unpack/$d/bin:$PATH" axiom build --input probe.ax --output probe
          set +e; ./probe; rc=$?; set -e
          [[ $rc -eq 42 ]] || { echo "FAIL: unpacked compiler produced exit $rc, wanted 42"; exit 1; }
          echo "ok   the archive's own stdlib resolves through a bare-name PATH invocation"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.ARCHIVE }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    # Write access is scoped to this job, the only one that needs it.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          ls -l dist

          # Publish this release's section of the changelog, not the
          # whole file. GitHub caps a release body at 125,000 characters,
          # and a reader opening a release wants that release's notes.
          notes="$(mktemp)"
          awk -v tag="## $v " '
            index($0, tag) == 1 { f = 1 }
            f && /^## / && index($0, tag) != 1 { exit }
            f { print }
          ' CHANGELOG.md > "$notes"

          # A missing or empty section stops the release instead of
          # publishing an empty body, as an empty golden fails elsewhere.
          if [[ ! -s "$notes" ]]; then
            echo "FAIL: CHANGELOG.md has no '## $v' section to publish as notes." >&2
            echo "      The release body would have been empty." >&2
            exit 1
          fi
          echo "release notes: $(wc -c < "$notes") characters, $(wc -l < "$notes") lines"

          # A section too long for one release body publishes its
          # highlights. The section opens with a highlights block ending
          # at the line `<!-- release-notes: end of highlights -->`, and
          # the body is that block plus a link to the whole section at
          # the tag. A long section with no marker stops the release
          # instead of being cut at an arbitrary line. `wc -c` counts
          # bytes, never fewer than characters, so a section within the
          # 120,000-byte threshold fits under the cap.
          if (( $(wc -c < "$notes") > 120000 )); then
            short="$(mktemp)"
            if ! awk '/^<!-- release-notes: end of highlights -->$/ { found = 1; exit }
                      { print }
                      END { exit !found }' "$notes" > "$short"; then
              echo "FAIL: the '## $v' section is over 120,000 characters and has no" >&2
              echo "      '<!-- release-notes: end of highlights -->' line to end its highlights." >&2
              exit 1
            fi
            printf '\nThe full notes for %s are in [CHANGELOG.md](%s/%s/blob/%s/CHANGELOG.md).\n' \
              "$v" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> "$short"
            notes="$short"
            echo "release notes: the highlights, $(wc -c < "$notes") characters, and a link to the rest"
          fi

          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Axiom $v" \
            --notes-file "$notes" \
            --verify-tag

name: Pages

# Builds and deploys the website, and nothing else.
#
# It is independent of `ci.yml`: it shares no job, needs nothing from the
# gate battery and runs no Axiom code. A copy change can't turn the
# compiler's CI red, and a red gate can't hold up a typo fix on the site.
# The path filter means a commit touching only `self_host/` or `stdlib/`
# starts nothing here.

on:
  push:
    # `trunk` is the only branch. A misspelt branch here fails silently:
    # a deploy that never runs looks just like a site nobody changed.
    branches: [trunk]
    paths:
      - 'web/**'
      # The site draws its logo from the brand kit's outlines, so an
      # edit there is an edit to the page.
      - 'assets/logo/geometry.json'
      - '.github/workflows/pages.yml'
  # Manual, for a re-deploy after changing the Pages source in Settings.
  workflow_dispatch:

# No permissions at the workflow level; each job asks for its own. The
# build job runs `npm ci` and every package it installs, so it only reads.
# Only the deploy job, which runs no repository code and one pinned
# action, can publish. `ci.yml` and `release.yml` scope tokens the same way.
permissions: {}

# One deployment at a time, and a running one is never cancelled:
# cancelling between the upload and the publish leaves the site on the
# previous artifact with a green check against the new commit.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: web

# Every action is pinned to a commit, as in `ci.yml` and `release.yml`.
# Its owner can move a tag like `@v4` at any time; a SHA moves only by a
# reviewed edit to this file. The trailing comment names the release.
jobs:
  build:
    runs-on: ubuntu-latest
    # Read access for the checkout and for `configure-pages`, which reads
    # the site's settings.
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: The custom domain serves the site at its root
        env:
          PAGES_HOST: ${{ steps.pages.outputs.host }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          domain="$(tr -d '[:space:]' < public/CNAME)"
          [[ "$domain" == "axiomlang.software" ]]
          [[ "$PAGES_HOST" == "$domain" ]]
          [[ -z "$PAGES_BASE_PATH" ]]
          echo "ok   Pages serves https://$domain/"

      # `npm ci` installs exactly what the committed lockfile says, and
      # fails if the lockfile and `package.json` disagree.
      - run: npm ci

      # `npm run build` runs `check-claims.mjs` first, which holds the
      # page's figures to the tree they describe, so a stale number fails
      # the deploy. Then come `tsc -b`, the bundle and the prerender.
      - run: npm run build

      # Renders the component tree in Node, as the nearest thing to opening
      # the page, and asserts: no React warning, one `h1`, no skipped
      # heading level, every in-page anchor resolves, and every
      # `target=_blank` carries `rel=noopener`.
      - run: node scripts/smoke.mjs

      # Without `.nojekyll`, the Pages pipeline strips paths that begin
      # with `_`. Vite's hashed assets live under `assets/`, so nothing
      # needs it yet; it keeps a future `_` path from becoming a 404.
      - run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only what `deploy-pages` needs: `pages: write` publishes, and
    # `id-token: write` is the OIDC token that attests the deployment.
    # There is no checkout, so no `contents`.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

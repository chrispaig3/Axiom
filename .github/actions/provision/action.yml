name: Provision an Axiom compiler
description: >
  Install the pinned LLVM tools the gates shell out to, record their
  versions, then turn the committed seed into a working compiler at
  .axiom-bin/axiom.

# Every job that needs a compiler uses this action, so the toolchain is
# chosen and recorded in one place.
runs:
  using: composite
  steps:
    # `llc` is not on the default PATH on either runner image, and the
    # compiler shells out to it by name. `llvm-readobj` comes from the
    # same package and is what the cross-target gate uses to reject
    # non-position-independent objects.
    # `lld` is a separate package on both images, and it is here for
    # one gate: `check-freestanding.sh` links a Windows PE with
    # `lld-link` on every host - cross, from an import library
    # `llvm-dlltool` generates - as the negative probe that its PE
    # reader sees imports at all. No Windows SDK is involved anywhere.
    # `libclang-rt-18-dev` is clang's sanitizer runtimes
    # (`libclang_rt.tsan*`, `libclang_rt.asan*`), which
    # `check-race.sh` links; a preinstalled clang need not carry them.
    # Homebrew's llvm ships them.
    #
    # The LLVM major version is pinned per runner OS: 18 is Ubuntu
    # 24.04's own toolchain and 23 is the Homebrew series the macOS leg
    # runs. Changing either is a toolchain change, so it is made here
    # and in `want` below, together.
    - name: Install LLVM tools (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y llvm-18 clang-18 lld-18 libclang-rt-18-dev
        echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"
    # `brew --prefix <formula>` exits zero even when the formula is
    # absent, so install first, then resolve the prefix.
    - name: Install LLVM tools (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install llvm@23 lld
        echo "$(brew --prefix llvm@23)/bin" >> "$GITHUB_PATH"
        echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
    # The toolchain record for this run, and a hard stop if the runner
    # image delivered a different LLVM major than the one pinned above.
    - name: Record the toolchain
      shell: bash
      run: |
        want=18
        [[ "$RUNNER_OS" == macOS ]] && want=23
        for tool in opt llc clang ld.lld lld-link; do
          printf '%-9s %s\n' "$tool" "$("$tool" --version 2>&1 | head -1)"
        done
        got="$(llc --version | sed -n 's/.*LLVM version \([0-9][0-9]*\).*/\1/p' | head -1)"
        if [[ "$got" != "$want" ]]; then
          echo "::error::expected LLVM $want on $RUNNER_OS, found ${got:-none}"
          exit 1
        fi

    # Every gate needs a compiler, and there is no longer one to build
    # from source in the usual sense - the compiler IS the source.
    # `bootstrap/` holds its LLVM IR, one file per target; this turns
    # that into a working binary with `llc` and `cc` and nothing else,
    # and installs it where the shared gate preamble's default `$AXIOM`
    # looks. A failure here is the seed going stale: `scripts/reseed.sh`.
    - name: Provision a compiler from the committed seed
      shell: bash
      run: ./scripts/bootstrap-from-seed.sh --install .axiom-bin

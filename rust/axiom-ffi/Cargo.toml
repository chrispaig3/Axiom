[package]
name = "axiom-ffi"
description = "Write Rust that Axiom can call. Re-exports the ABI and the #[axiom_export] attribute."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axiom-abi = { workspace = true }
axiom-ffi-macros = { workspace = true }

[features]
# `std` is the DEFAULT because it is what makes the ecosystem reachable:
# most crates worth binding are std crates. It costs the freestanding
# property - measured, an Axiom executable linked against a std staticlib
# imports 188 symbols, 18 of them on check-freestanding.sh's forbidden
# list - which is exactly what the opt-in FFI gate exists to account for.
#
# `no_std` keeps the property intact: the same executable linked against
# a no_std + panic=abort staticlib has an EMPTY `nm -u`. Choose it when
# the crate you are binding can live in `core` + `alloc`.
default = ["std"]
std = []
# The runtime a `no_std` crate otherwise pastes by hand: a GlobalAlloc
# over `axiom_alloc`, the panic handler, the personality stub and the
# memory intrinsics the precompiled `alloc` rlib references. Mutually
# exclusive with `std` (it would define a second allocator and panic
# handler); use `default-features = false, features = ["nostd-runtime"]`.
nostd-runtime = []
# The other direction: a Rust BINARY that links an Axiom archive
# (`axiom build --emit-staticlib`) and calls its `pub fn`s. Supplies the
# `host` module - `AxString::from_str` over the archive's own
# `Str$strAlloc`, `read_str` - which declares symbols only such an
# archive defines, so it is off unless asked for (a staticlib that
# Axiom links must not reference them).
host = []

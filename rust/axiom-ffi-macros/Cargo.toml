[package]
name = "axiom-ffi-macros"
description = "The #[axiom_export] and #[axiom_opaque] attributes: generate the C-ABI shims Axiom links against."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
proc-macro = true

[dependencies]
axiom-ffi-classify = { workspace = true }
syn = { workspace = true }
quote = { workspace = true }
proc-macro2 = { workspace = true }

[dev-dependencies]
# The UI tests compile crates that use the generated shims, which call
# into the facade; a dev-dependency cycle is what cargo expects here
# (serde_derive's tests depend on serde the same way).
axiom-ffi = { path = "../axiom-ffi" }
trybuild = "1"

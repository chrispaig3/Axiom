[package]
name = "axiom-bindgen"
description = "Read a crate's #[axiom_export] surface and emit the matching Axiom `extern` module."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "axiom_bindgen"
path = "src/lib.rs"

[[bin]]
name = "axiom-bindgen"
path = "src/main.rs"

[dependencies]
axiom-ffi-classify = { workspace = true }
syn = { workspace = true }

[lints]
workspace = true

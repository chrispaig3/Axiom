# STYLE EDITION PINNED TO 2021, while the crates moved to edition 2024
# on 2026-09-03.
#
# The edition bump was made for one lint - `unsafe_op_in_unsafe_fn`,
# which edition 2024 promotes to a hard error - and not for a change of
# layout. rustfmt's style edition tracks the language edition unless it
# is pinned, and letting it move would have reformatted thirteen files,
# `examples/host/src/hostlib.rs` among them. That file is GENERATED by
# `self_host/rustbind.ax` and `scripts/check-ffi.sh` diffs it byte for
# byte against a fresh generation, so a formatting change there is not a
# formatting change: it is the emitter and the checked-in binding
# disagreeing, and the fix would have been to teach an Axiom program
# rustfmt's new preferences.
#
# Unpin deliberately, in a commit that also regenerates the binding and
# re-runs check-ffi - not as a side effect of an edition bump.
style_edition = "2021"

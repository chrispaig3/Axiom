# The Axiom <-> Rust FFI support workspace.
#
# Nothing in this directory is needed to BUILD the Axiom compiler.
# `scripts/bootstrap-from-seed.sh` still goes from `bootstrap/*.ll`
# through `llc` and `cc` with no Rust toolchain anywhere, which is the
# property that lets a checkout with no cargo still produce a compiler.
# Cargo is required only to run the FFI gates and to build a crate a
# program actually binds.
[workspace]
resolver = "2"
# `examples/nostd` is deliberately NOT a member: see its Cargo.toml.
exclude = ["examples/nostd"]

members = [
    "axiom-abi",
    "axiom-ffi-classify",
    "axiom-ffi-macros",
    "axiom-ffi",
    "axiom-bindgen",
    "examples/demo",
    "examples/leaky",
    "examples/host",
]

# `examples/host` is a member but not a DEFAULT member: it is a binary
# that links an archive the Axiom compiler writes (`--emit-staticlib`),
# so a bare `cargo build` / `cargo test` at the root - which must work
# with no Axiom toolchain - leaves it out. The FFI gate builds the
# archive and runs `cargo run -p axiom-host` explicitly.
default-members = [
    "axiom-abi",
    "axiom-ffi-classify",
    "axiom-ffi-macros",
    "axiom-ffi",
    "axiom-bindgen",
    "examples/demo",
    "examples/leaky",
]

[workspace.package]
version = "0.3.4"
edition = "2021"
license = "MIT"

[workspace.dependencies]
axiom-abi = { path = "axiom-abi", version = "0.3.4" }
axiom-ffi-macros = { path = "axiom-ffi-macros", version = "0.3.4" }
axiom-ffi-classify = { path = "axiom-ffi-classify", version = "0.3.4" }
# `parsing` and `printing` are syn defaults; the `visit` visitor API is
# used by none of the three crates that parse Rust here.
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"

[profile.release]
# Rust `extern "C"` aborts on unwind anyway (1.81+), and Axiom has no
# landing pads at all - its emitter never writes `invoke`. Saying so
# explicitly also drops the unwind tables from the archive.
panic = "abort"
